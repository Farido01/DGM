            x = p.x;
            y = p.y;
          } else if (d.circleNum === 4) {
            const p = getPerformerEntrancePosCircle4(d, u);
            x = p.x;
            y = p.y;
          } else {
            x = d.pInit.x;
            y = d.pInit.y;
          }
        } else if (tSec <= 76.0) {
          // 26..76s (50s): Стоят в 4-х кругах
          x = d.pInit.x;
          y = d.pInit.y;
        } else if (tSec < 82.0) {
          // 76..82s (6s): Идеальный переход из 4-х кругов в 2 круга / 3 дуги
          const u = (tSec - 76.0) / 6.0;
          if (d.isInnerRing && d.color === PINK_GRAY) {
            const sFast = easeInOutCubic(Math.min(1, u / 0.40));
            const dx0 = d.pInit.x - CIRC_CX;
            const dy0 = d.pInit.y - CIRC_CY;
            const dx1 = d.p0.x - CIRC_CX;
            const dy1 = d.p0.y - CIRC_CY;
            const r0 = Math.hypot(dx0, dy0);
            const r1 = Math.hypot(dx1, dy1);
            let a0 = Math.atan2(dy0, dx0);
            let a1 = Math.atan2(dy1, dx1);
            let da = a1 - a0;
            while (da > Math.PI) da -= 2 * Math.PI;
            while (da < -Math.PI) da += 2 * Math.PI;
            const r = r0 + (r1 - r0) * sFast;
            const a = a0 + da * sFast;
            x = CIRC_CX + r * Math.cos(a);
            y = CIRC_CY + r * Math.sin(a);
          } else {
            const p = getCircleTransitionPt(d.pInit, d.p0, u);
            x = p.x;
            y = p.y;
          }
        } else if (tSec < 106.0) {
          const diamondT = (tSec - 82.0) / 24.0;
          const curDist = d.s0 + (d.s1 - d.s0) * diamondT;
          const p = getPointAtDist(d.trackPts, d.trackDists, curDist);
          x = p.x;
          y = p.y;
        } else {
          x = d.p1.x;
          y = d.p1.y;

        currentPositions.diamond[i] = { x, y, dot: d };

      });

    function closeDotCard() {
      selectedDotInfo = null;
      document.getElementById('dot-info-card').style.display = 'none';
      const selLayer = document.getElementById('selection-layer');
      if (selLayer) selLayer.innerHTML = '';
    }

    function onDotClick(event, group, idx) {
      event.stopPropagation();
      selectDot(group, idx);
    }

    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function getPathPos(P0, P1, P2, P3, d) {
      const L_3 = Math.hypot(P1.x - P0.x, P1.y - P0.y);
      const L_turn = Math.hypot(P2.x - P1.x, P2.y - P1.y);
      const L_2 = Math.hypot(P3.x - P2.x, P3.y - P2.y);
      if (d <= L_3) {
        const ratio = L_3 === 0 ? 0 : d / L_3;
        return { x: P0.x + (P1.x - P0.x) * ratio, y: P0.y + (P1.y - P0.y) * ratio };
      } else if (d <= L_3 + L_turn) {
        const ratio = L_turn === 0 ? 0 : (d - L_3) / L_turn;
        return { x: P1.x + (P2.x - P1.x) * ratio, y: P1.y + (P2.y - P1.y) * ratio };
      } else {
        const ratio = L_2 === 0 ? 0 : (d - L_3 - L_turn) / L_2;
        return { x: P2.x + (P3.x - P2.x) * ratio, y: P2.y + (P3.y - P2.y) * ratio };
      }
    }

    function calcPersonPosition(d, t, isRight = false) {
      if (t <= 0) return { x: d.p1.x, y: d.p1.y };
      if (t >= 1) return { x: d.p2.x, y: d.p2.y };
      const idx = d.idx || 0;
      const total = d.total || 30;
      const delay = (idx / total) * 0.04;
      const moveT = Math.max(0, Math.min(1, (t - delay) / (1 - 0.04)));
      const s = easeInOutCubic(moveT);
      const dx = d.p2.x - d.p1.x;
      const dy = d.p2.y - d.p1.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 1.0) return { x: d.p1.x + dx * s, y: d.p1.y + dy * s };
      const numSteps = Math.max(3, Math.round(dist / 13));
      const stepModulation = (Math.sin(2 * Math.PI * numSteps * s) / (2 * Math.PI * numSteps)) * 0.36;
      const s_step = Math.max(0, Math.min(1, s - stepModulation));
      let curX = d.p1.x + dx * s_step;
      let curY = d.p1.y + dy * s_step;
      const nx = -dy / dist;
      const ny = dx / dist;
      const stepSway = Math.sin(Math.PI * numSteps * s) * 0.65 * Math.sin(Math.PI * s);
      curX += nx * stepSway;
      curY += ny * stepSway;
      return { x: curX, y: curY };
    }

    function getRealisticCircleTransition(pInit, pTarget, t) {
      const dx0 = pInit.x - CIRC_CX;
      const dy0 = pInit.y - CIRC_CY;
      const dx1 = pTarget.x - CIRC_CX;
      const dy1 = pTarget.y - CIRC_CY;
      const r0 = Math.hypot(dx0, dy0);
      const r1 = Math.hypot(dx1, dy1);
      let a0 = Math.atan2(dy0, dx0);
      let a1 = Math.atan2(dy1, dx1);
      let da = a1 - a0;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      const sRadial = easeInOutCubic(Math.min(1, t / 0.50));
      const sAngular = easeInOutCubic(Math.max(0, (t - 0.25) / 0.75));
      const r = r0 + (r1 - r0) * sRadial;
      const a = a0 + da * sAngular;
      return { x: CIRC_CX + r * Math.cos(a), y: CIRC_CY + r * Math.sin(a) };
    }

    // ── 106-Second Master Timeline ──────────────────────────────────────────────
    // 0..26s (26s): Вход диагоналей и последовательный марш 2-го и 3-го кругов
    // 26..76s (50s): Пауза / Все стоят на своих местах (3 полукруга + 4 круга)
    // 76..106s (30s): Полный переход кругов и полукругов в ромбы и 2 диагонали

    // Хранилище текущих вычисленных позиций для отображения координат клика
    const currentPositions = {

    function renderDiamondDots(t) {

        } else if (tSec < 134.0) {
          // 2:00..2:14 (14s): Внутренний сбор / переход из 4-х кругов в 2 круга / 3 дуги
          const u = (tSec - 120.0) / 14.0;
          if (d.isInnerRing && d.color === PINK_GRAY) {
            const sFast = easeInOutCubic(Math.min(1, u / 0.40));
            const dx0 = d.pInit.x - CIRC_CX;
            const dy0 = d.pInit.y - CIRC_CY;
            const dx1 = d.p0.x - CIRC_CX;
            const dy1 = d.p0.y - CIRC_CY;
            const r0 = Math.hypot(dx0, dy0);
            const r1 = Math.hypot(dx1, dy1);
            let a0 = Math.atan2(dy0, dx0);
            let a1 = Math.atan2(dy1, dx1);
            let da = a1 - a0;
            while (da > Math.PI) da -= 2 * Math.PI;
            while (da < -Math.PI) da += 2 * Math.PI;
            const r = r0 + (r1 - r0) * sFast;
            const a = a0 + da * sFast;
            x = CIRC_CX + r * Math.cos(a);
            y = CIRC_CY + r * Math.sin(a);
          } else {
            const p = getCircleTransitionPt(d.pInit, d.p0, u);
            x = p.x;
            y = p.y;
          }
        } else if (tSec < 165.0) {
          // 2:14..2:45 (31s): Выход в ромбы
          const diamondT = (tSec - 134.0) / 31.0;
          const curDist = d.s0 + (d.s1 - d.s0) * diamondT;
          const p = getPointAtDist(d.trackPts, d.trackDists, curDist);
          x = p.x;
          y = p.y;
        } else if (tSec <= 170.0) {
          // 2:45..2:50 (5s): Фиксация в ромбах
          x = d.p1.x;
          y = d.p1.y;
        } else if (tSec < 185.0) {
          // 2:50..3:05 (15s): Марширование по индивидуальным направляющим трекам без пересечений и с сохранением дистанции
          const u = (tSec - 170.0) / 15.0;
          const s = easeInOutCubic(u);
          if (d.hpTrackPts && d.hpTrackDists && d.hpTotalLen > 0) {
            const curDist = d.hpTotalLen * s;
            const p = getPointAtDist(d.hpTrackPts, d.hpTrackDists, curDist);
            x = p.x;
            y = p.y;
          } else {
            x = d.p1.x + (d.pHeadphone.x - d.p1.x) * s;
            y = d.p1.y + (d.pHeadphone.y - d.p1.y) * s;
          }
        } else {
          // 3:05+ : Фигура «Наушники»
          x = d.pHeadphone.x;
          y = d.pHeadphone.y;
        }

        currentPositions.diamond[i] = { x, y, dot: d };
        html += `<circle class="interactive-dot" onpointerdown="onDotPointerDown(event, 'diamond', ${i})" onclick="onDotClick(event, 'diamond', ${i})" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${R_D}" fill="${d.color}" stroke="transparent" stroke-width="12" />`;
      });
      diamondLayer.innerHTML = html;
    }

    const T_ALL_EXIT = Math.max(...diamondDots.map(d => (d.trackDists[60 + 20] - d.s0) / (d.s1 - d.s0)));
    function renderCircleDots(t) {
      const tSec = t * 185.0;
      let html = '';
      currentPositions.circle = [];

      if (tSec < 34.5) {
        // 0..34.5s: Ожидание в коробке
        circle1Dots.forEach((d, i) => {

        });
      } else if (tSec <= 60.0) {
        // 34.5..60s (1:00, 25.5s): Синхронный марш 1-го круга
        const u = (tSec - 34.5) / 25.5;
        circle1Dots.forEach((d, i) => {
          const p = getCircle1EntrancePos(d, u);
          currentPositions.circle[i] = { x: p.x, y: p.y, dot: d };
          html += `<circle class="interactive-dot" onpointerdown="onDotPointerDown(event, 'circle', ${i})" onclick="onDotClick(event, 'circle', ${i})" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${R_S}" fill="${BLACK_SQ}" stroke="transparent" stroke-width="10" />`;
        });
      } else if (tSec <= 120.0) {
        // 60..120s (1:00..2:00, 60s): Стоят в 1-м круге R=10
        circle1Dots.forEach((d, i) => {
          currentPositions.circle[i] = { x: d.pInit.x, y: d.pInit.y, dot: d };
          html += `<circle class="interactive-dot" onpointerdown="onDotPointerDown(event, 'circle', ${i})" onclick="onDotClick(event, 'circle', ${i})" cx="${d.pInit.x.toFixed(2)}" cy="${d.pInit.y.toFixed(2)}" r="${R_S}" fill="${BLACK_SQ}" stroke="transparent" stroke-width="10" />`;
        });
      } else {
        // 120..165s: Раскрытие снизу на 2:00..2:14 и закрытие после выхода ромбов. После 2:45 остается закрытым!
        let openCols;
        if (tSec < 134.0) {
          const u = (tSec - 120.0) / 14.0;
          openCols = 2 * easeInOutCubic(u);
        } else if (tSec < 165.0) {
          const diamondT = (tSec - 134.0) / 31.0;
          const closeT = Math.max(0, Math.min(1, (diamondT - T_ALL_EXIT) / 0.04));
          openCols = 2 * (1 - closeT);
        } else {
          openCols = 0; // Закрыт
        }
        const pts = openCircPts(CIRC_CX, CIRC_CY, CIRC_R, CIRC_N, openCols);
        pts.forEach((p, i) => {
          currentPositions.circle[i] = { x: p.x, y: p.y, dot: { color: BLACK_SQ, idx: i } };
          html += `<circle class="interactive-dot" onpointerdown="onDotPointerDown(event, 'circle', ${i})" onclick="onDotClick(event, 'circle', ${i})" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${R_S}" fill="${BLACK_SQ}" stroke="transparent" stroke-width="10" />`;
        });
      }
      circleLayer.innerHTML = html;
    }

    function renderDiagonalDots(t) {
      const tSec = t * 185.0;
      let html = '';
      currentPositions.diagLeft = [];
      currentPositions.diagRight = [];

      // Left performers
      for (let i = 0; i < dotsLeft.length; i++) {
        const d = dotsLeft[i];
        let p;
        if (tSec < 68.0) {
          // 0..1:08 (68s): Стоят в коробке ожидания
          p = getEntranceLinePoint(d.lineNum, d.lineDotIdx, d.lineTotal, false, 0);
        } else if (tSec <= 84.0) {
          // 1:08..1:24 (16s): Вход полукругов (3 дуги)
          const u = (tSec - 68.0) / 16.0;
          p = getEntranceLinePoint(d.lineNum, d.lineDotIdx, d.lineTotal, false, u);
        } else if (tSec <= 120.0) {
          // 1:24..2:00 (36s): Главная статичная сцена (3 дуги)
          p = d.p0;
        } else if (tSec < 134.0) {
          // 2:00..2:14 (14s): Переход полукругов из 3-х дуг в 3 линии (НАЧИНАЮТ ДВИЖЕНИЕ ОТ 2:00!)
          const u = (tSec - 120.0) / 14.0;
          const s = easeInOutCubic(u);
          p = {
            x: d.p0.x + (d.p1.x - d.p0.x) * s,
            y: d.p0.y + (d.p1.y - d.p0.y) * s,
          };
        } else if (tSec < 165.0) {
          // 2:14..2:45 (31s): Переход из 3-х линий в 2 диагональные линии
          const u = (tSec - 134.0) / 31.0;
          p = calcPersonPosition(d, u, false);
        } else if (tSec <= 170.0) {
          // 2:45..2:50 (5s): Стоят в 2-х диагональных линиях
          p = d.p2;
        } else if (tSec < 185.0) {
          // 2:50..3:05 (15s): ВСЕ 100 участников синхронно переходят:
          // - 10 участников закрывают открытую часть наушников по верхней петле
          // - остальные участники синхронно занимают верхние купольные дуги и диагональные линии
          if (d.hookTrackPts && d.hookTrackDists) {
            const u = (tSec - 170.0) / 15.0;
            const s = easeInOutCubic(u);
            const curDist = d.hookS0 + (d.hookS1 - d.hookS0) * s;
            p = getPointAtDist(d.hookTrackPts, d.hookTrackDists, curDist);
          } else if (d.pHeadphone) {
            const u = (tSec - 170.0) / 15.0;
            const s = easeInOutCubic(u);
            p = {
              x: d.p2.x + (d.pHeadphone.x - d.p2.x) * s,
              y: d.p2.y + (d.pHeadphone.y - d.p2.y) * s,
            };
          } else {
            p = d.p2;
          }
        } else {
          // 3:05+ : Зафиксированы в новой фигуре наушников
          if (d.hookTrackPts && d.hookTrackDists) {
            p = getPointAtDist(d.hookTrackPts, d.hookTrackDists, d.hookS1);
          } else if (d.pHeadphone) {
            p = d.pHeadphone;
          } else {
            p = d.p2;
          }
        }
        currentPositions.diagLeft[i] = { x: p.x, y: p.y, dot: d };
        html += `<circle class="interactive-dot" onpointerdown="onDotPointerDown(event, 'diagLeft', ${i})" onclick="onDotClick(event, 'diagLeft', ${i})" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${R_LINE}" fill="${d.color}" stroke="transparent" stroke-width="10" />`;
      }

      // Right performers (mirrored)
      for (let i = 0; i < dotsRight.length; i++) {
        const d = dotsRight[i];
        let p;
        if (tSec < 68.0) {
          p = getEntranceLinePoint(d.lineNum, d.lineDotIdx, d.lineTotal, true, 0);
        } else if (tSec <= 84.0) {
          const u = (tSec - 68.0) / 16.0;
          p = getEntranceLinePoint(d.lineNum, d.lineDotIdx, d.lineTotal, true, u);
        } else if (tSec <= 120.0) {
          p = d.p0;
        } else if (tSec < 134.0) {
          const u = (tSec - 120.0) / 14.0;
          const s = easeInOutCubic(u);
          p = {
            x: d.p0.x + (d.p1.x - d.p0.x) * s,
            y: d.p0.y + (d.p1.y - d.p0.y) * s,
          };
        } else if (tSec < 165.0) {
          const u = (tSec - 134.0) / 31.0;
          p = calcPersonPosition(d, u, true);
        } else if (tSec <= 170.0) {
          p = d.p2;
        } else if (tSec < 185.0) {
          if (d.hookTrackPts && d.hookTrackDists) {
            const u = (tSec - 170.0) / 15.0;
            const s = easeInOutCubic(u);
            const curDist = d.hookS0 + (d.hookS1 - d.hookS0) * s;
            p = getPointAtDist(d.hookTrackPts, d.hookTrackDists, curDist);
          } else if (d.pHeadphone) {
            const u = (tSec - 170.0) / 15.0;
            const s = easeInOutCubic(u);
            p = {
              x: d.p2.x + (d.pHeadphone.x - d.p2.x) * s,
              y: d.p2.y + (d.pHeadphone.y - d.p2.y) * s,
            };
          } else {
            p = d.p2;
          }
        } else {
          if (d.hookTrackPts && d.hookTrackDists) {
            p = getPointAtDist(d.hookTrackPts, d.hookTrackDists, d.hookS1);
          } else if (d.pHeadphone) {
            p = d.pHeadphone;
          } else {
            p = d.p2;
          }
        }
        currentPositions.diagRight[i] = { x: p.x, y: p.y, dot: d };
        html += `<circle class="interactive-dot" onpointerdown="onDotPointerDown(event, 'diagRight', ${i})" onclick="onDotClick(event, 'diagRight', ${i})" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${R_LINE}" fill="${d.color}" stroke="transparent" stroke-width="10" />`;
      }
      diagLayer.innerHTML = html;
    }

    function updateSelectionRing() {
      const selLayer = document.getElementById('selection-layer');
      const card = document.getElementById('dot-info-card');
      if (!selLayer || !card) return;

      if (!selectedDotInfo) {
        selLayer.innerHTML = '';
        card.style.display = 'none';
        return;
      }

      const { group, idx } = selectedDotInfo;
      const list = currentPositions[group];
      if (!list || !list[idx]) return;

      const item = list[idx];
      const { x, y, dot } = item;
      const tSec = currentT * 185.0;

      let guideLinesHtml = '';

      // Crosshair & Alignment Lines System
      if (tSec >= 184.0 && group === 'diamond') {
        // Find dots that share the same horizontal row (Y within 2.5px)
        const rowMatches = diamondDots.filter(d => d.pHeadphone && Math.abs(d.pHeadphone.y - y) <= 2.5);
        // Find dots that share the same vertical col (X within 2.5px)
        const colMatches = diamondDots.filter(d => d.pHeadphone && Math.abs(d.pHeadphone.x - x) <= 2.5);

        if (rowMatches.length >= 2) {
          // Bright horizontal laser line connecting all dots in this row!
          guideLinesHtml += `
            <line x1="${FX}" y1="${y}" x2="${FX + FIELD_W}" y2="${y}" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" opacity="0.9">
              <animate attributeName="stroke-dashoffset" values="0;24" dur="1.2s" repeatCount="indefinite"/>
            </line>
            <rect x="${FX + 10}" y="${y - 12}" width="140" height="22" rx="5" fill="rgba(15, 23, 42, 0.88)" stroke="#38bdf8" stroke-width="1"/>
            <text x="${FX + 16}" y="${y + 3}" fill="#38bdf8" font-size="11" font-weight="700" font-family="sans-serif">📏 Ряд (${rowMatches.length} точек в линию)</text>
          `;
        } else {
          // Subtle aim guide
          guideLinesHtml += `<line x1="${FX}" y1="${y}" x2="${FX + FIELD_W}" y2="${y}" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.45" />`;
        }

        if (colMatches.length >= 2) {
          // Bright vertical laser line connecting all dots in this column!
          guideLinesHtml += `
            <line x1="${x}" y1="${FY}" x2="${x}" y2="${FY + FIELD_H}" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4" opacity="0.9">
              <animate attributeName="stroke-dashoffset" values="0;24" dur="1.2s" repeatCount="indefinite"/>
            </line>
            <rect x="${x - 65}" y="${FY + 10}" width="130" height="22" rx="5" fill="rgba(15, 23, 42, 0.88)" stroke="#38bdf8" stroke-width="1"/>
            <text x="${x - 58}" y="${FY + 25}" fill="#38bdf8" font-size="11" font-weight="700" font-family="sans-serif">📏 Кол (${colMatches.length} точек в линию)</text>
          `;
        } else {
          // Subtle aim guide
          guideLinesHtml += `<line x1="${x}" y1="${FY}" x2="${x}" y2="${FY + FIELD_H}" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.45" />`;
        }
      }

      // Draw Animated Target Halo & Dynamic Alignment Lines
      selLayer.innerHTML = `
        ${guideLinesHtml}
        <circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2">
          <animateTransform attributeName="transform" type="rotate" from="0 ${x} ${y}" to="360 ${x} ${y}" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5">
          <animate attributeName="r" values="10;17;10" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      `;

      // Build Details for Card
      let title = "Участник";
      let groupName = "";
      let colorHex = dot.color || "#000";
      let icon = "👤";

      if (group === 'diamond') {
        if (dot.circleNum === 2) {
          const m = dot.trainIdx ?? 0;
          const colNum = Math.floor(m / 25) + 1;
          const spotInCol = (m % 25) + 1;
          if (m === 0) {
            title = "👑 Капитан 2-го круга (Линия 1, №1)";
            icon = "👑";
          } else {
            title = `Участник 2-го круга (Линия ${colNum}, №${spotInCol})`;
          }
          groupName = "2-й Круг (R=7, 100 чел)";
        } else if (dot.circleNum === 3) {
          const m = dot.trainIdx3 ?? 0;
          const colNum = Math.floor(m / 25) + 1;
          const spotInCol = (m % 25) + 1;
          if (m === 0) {
            title = "👑 Капитан 3-го круга (Линия 1, №1)";
            icon = "👑";
          } else {
            title = `Участник 3-го круга (Линия ${colNum}, №${spotInCol})`;
          }
          groupName = "3-й Круг (R=4, 50 чел)";
        } else if (dot.circleNum === 4) {
          const m = dot.trainIdx4 ?? (dot.idx ?? 0);
          if (m === 0) {
            title = "👑 Капитан 4-го круга (Колонна 0, №1)";
            icon = "👑";
          } else {
            title = `Участник 4-го круга (Колонна 0, №${m + 1})`;
            icon = "🔴";
          }
          groupName = "4-й Круг (R=1, 10 чел)";
        }
      } else if (group === 'diagLeft') {
        title = `Левая диагональ: Линия ${dot.lineNum}, №${dot.lineDotIdx + 1}`;
        groupName = "Левая диагональная группа (100 чел)";
      } else if (group === 'diagRight') {
        title = `Правая диагональ: Линия ${dot.lineNum}, №${dot.lineDotIdx + 1}`;
        groupName = "Правая диагональная группа (100 чел)";
      } else if (group === 'circle') {
        title = `Точка 1-го внешнего круга №${idx + 1}`;
        groupName = "1-й Внешний круг (R=10, 140 чел)";
      }

      const grid = getFieldGridCoords(x, y);

      document.getElementById('card-dot-icon').textContent = icon;
      document.getElementById('card-dot-title').textContent = title;
      document.getElementById('card-dot-group').textContent = groupName;
      document.getElementById('card-dot-swatch').style.backgroundColor = colorHex;
      document.getElementById('card-dot-color-name').textContent = getColorName(colorHex);
      document.getElementById('card-dot-grid').textContent = `Кол: ${grid.colStr} | Ряд: ${grid.rowStr}`;
      document.getElementById('card-dot-svg').textContent = `X: ${grid.svgX} px, Y: ${grid.svgY} px`;

      card.style.display = 'block';
    }

    const diagLayer = document.getElementById('diag-layer');
    const diamondLayer = document.getElementById('diamond-layer');
    const circleLayer = document.getElementById('circle-layer');
    const slider = document.getElementById('progress-slider');
    const btn0 = document.getElementById('btn-draw0');
    const btn1 = document.getElementById('btn-draw1');
    const btn2 = document.getElementById('btn-draw2');
    const btn3 = document.getElementById('btn-draw3');
    const btn4 = document.getElementById('btn-draw4');
    const btn5 = document.getElementById('btn-draw5');
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');

    let currentT = 0.0;
    let isPlaying = false;
    let animDirection = 1;
    let animReq = null;

    function formatTime(tSec) {
      const m = Math.floor(tSec / 60);
      const s = (tSec % 60).toFixed(1);
      if (m > 0) {
        return `${m}:${s.padStart(4, '0')}`;
      }
      return `${s}с`;
    }

    function updateUI(t) {
      currentT = Math.max(0, Math.min(1, t));

      const slider = document.getElementById('progress-slider');
      if (slider) slider.value = Math.round(currentT * 1850);

      const tSec = currentT * 185.0;
      const timeDisplay = document.getElementById('time-display');
      if (timeDisplay) timeDisplay.textContent = formatTime(tSec);

      const btn0 = document.getElementById('btn-draw0');
      const btn1 = document.getElementById('btn-draw1');
      const btn2 = document.getElementById('btn-draw2');
      const btn3 = document.getElementById('btn-draw3');
      const btn4 = document.getElementById('btn-draw4');
      const btn5 = document.getElementById('btn-draw5');
      const btn6 = document.getElementById('btn-draw6');
      const btn7 = document.getElementById('btn-draw7');
      const btn8 = document.getElementById('btn-draw8');

      if (btn0) btn0.classList.toggle('active', tSec < 17.0);
      if (btn1) btn1.classList.toggle('active', tSec >= 17.0 && tSec < 47.0);
      if (btn2) btn2.classList.toggle('active', tSec >= 47.0 && tSec < 64.0);
      if (btn3) btn3.classList.toggle('active', tSec >= 64.0 && tSec < 76.0);
      if (btn4) btn4.classList.toggle('active', tSec >= 76.0 && tSec < 102.0);
      if (btn5) btn5.classList.toggle('active', tSec >= 102.0 && tSec < 127.0);
      if (btn6) btn6.classList.toggle('active', tSec >= 127.0 && tSec < 150.0);
      if (btn7) btn7.classList.toggle('active', tSec >= 150.0 && tSec < 177.5);
      if (btn8) btn8.classList.toggle('active', tSec >= 177.5);

      renderDiamondDots(currentT);
      renderCircleDots(currentT);
      renderDiagonalDots(currentT);
      updateSelectionRing();
    }

    const audio = document.getElementById('bg-audio');
    const btnMute = document.getElementById('btn-mute');
    const muteIcon = document.getElementById('mute-icon');

    function toggleMute() {
      if (!audio) return;
      audio.muted = !audio.muted;
      muteIcon.textContent = audio.muted ? '🔇' : '🔊';
    }

    function setMode(targetT) {
      stopAnimation();
      updateUI(targetT);
      if (audio) {
        audio.currentTime = targetT * 185.0;
      }
    }

    function onSlider(val) {
      stopAnimation();
      const targetT = Number(val) / 1850;
      updateUI(targetT);
      if (audio) {
        audio.currentTime = targetT * 185.0;
      }
    }

    function stopAnimation() {
      if (isPlaying) {
        isPlaying = false;
        cancelAnimationFrame(animReq);
        btnPlay.classList.remove('playing');
        playIcon.textContent = '▶';
        playText.textContent = 'Запустить с музыкой (3:05)';
        if (audio && !audio.paused) {
          audio.pause();
        }
      }
    }

    function togglePlay() {
      if (isPlaying) {
        stopAnimation();
      } else {
        isPlaying = true;
        btnPlay.classList.add('playing');
        playIcon.textContent = '⏸';
        playText.textContent = 'Пауза';

        if (currentT >= 1.0) {
          currentT = 0.0;
        }

        const startSec = currentT * 185.0;
        if (audio) {
          audio.currentTime = startSec;
          audio.play().catch(e => console.log('Audio playback notification:', e));
        }

        let lastTime = performance.now();
        const TOTAL_DURATION = 185000; // 185 секунд (3:05)

        function step(now) {
          if (!isPlaying) return;

          // Высокоточная синхронизация видеоряда с аудиофайлом DUSHANBE-3.wav
          if (audio && !audio.paused && !audio.ended && audio.duration > 0) {
            currentT = Math.min(1.0, audio.currentTime / 185.0);
          } else {
            const dt = now - lastTime;
            currentT += (dt / TOTAL_DURATION);
            if (currentT >= 1.0) currentT = 1.0;
          }
          lastTime = now;

          updateUI(currentT);

          if (currentT >= 1.0) {
            stopAnimation();
            return;
          }

          animReq = requestAnimationFrame(step);
        }

        animReq = requestAnimationFrame(step);
      }
    }

    // ── Direct, Precise Dot PointerDown, Click & Swap System ──
    let isDraggingDot = false;
    let draggedDotIdx = null;

    function showToast(msg) {
      const toast = document.getElementById('toast-notify');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function onResetSelectedDot() {
      if (!selectedDotInfo || selectedDotInfo.group !== 'diamond') return;
      const d = diamondDots[selectedDotInfo.idx];
      if (d && d.pHeadphone) {
        d.pHeadphone.x = d.pHeadphone.defaultX;
        d.pHeadphone.y = d.pHeadphone.defaultY;
        updateUI(currentT);
        updateSelectionRing();
        showToast('↩️ Позиция точки сброшена!');
      }
    }

    function onResetAllHeadphones() {
      diamondDots.forEach(d => {
        if (d && d.pHeadphone) {
          d.pHeadphone.x = d.pHeadphone.defaultX;
          d.pHeadphone.y = d.pHeadphone.defaultY;
        }
      });
      updateUI(currentT);
      updateSelectionRing();
      showToast('♻️ Все точки наушников возвращены в исходный вид!');
    }

    // ── Direct, Zero-Jump PointerDown & Fluid Movement System ──
    let isPointerDown = false;
    let isDragging = false;
    let dragStartPt = { x: 0, y: 0 };
    let dragOffset = { x: 0, y: 0 };
    let dragDotIdx = null;

    function showToast(msg) {
      const toast = document.getElementById('toast-notify');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    window.onNudgeDot = function(dxSteps, dySteps) {
      if (!selectedDotInfo || selectedDotInfo.group !== 'diamond') return;
      const d = diamondDots[selectedDotInfo.idx];
      if (d && d.pHeadphone) {
        d.pHeadphone.x += dxSteps * 6;
        d.pHeadphone.y += dySteps * 6;
        updateDotHpTrack(d);
        updateUI(currentT);
        updateSelectionRing();
      }
    };

    window.onResetSelectedDot = function() {
      if (!selectedDotInfo || selectedDotInfo.group !== 'diamond') return;
      const d = diamondDots[selectedDotInfo.idx];
      if (d && d.pHeadphone) {
        d.pHeadphone.x = d.pHeadphone.defaultX;
        d.pHeadphone.y = d.pHeadphone.defaultY;
        updateDotHpTrack(d);
        updateUI(currentT);
        updateSelectionRing();
        showToast('↩️ Позиция точки сброшена!');
      }
    };

    window.onResetAllHeadphones = function() {
      diamondDots.forEach(d => {
        if (d && d.pHeadphone) {
          d.pHeadphone.x = d.pHeadphone.defaultX;
          d.pHeadphone.y = d.pHeadphone.defaultY;
          updateDotHpTrack(d);
        }
      });
      updateUI(currentT);
      updateSelectionRing();
      showToast('♻️ Все точки наушников возвращены в исходный вид!');
    };

    // Direct pointer down on the EXACT clicked dot with ZERO JUMP
    window.onDotPointerDown = function(event, group, idx) {
      event.stopPropagation();
      const tSec = currentT * 185.0;

      // 1. Выбираем точку (позиция НЕ МЕНЯЕТСЯ!)
      selectedDotInfo = { group, idx };
      updateUI(currentT);
      updateSelectionRing();

      // 2. Инициализируем перетаскивание с запоминанием точного смещения курсора
      if (tSec >= 184.0 && group === 'diamond') {
        isPointerDown = true;
        isDragging = false;
        dragDotIdx = idx;

        const pt = getSvgPoint(event);
        dragStartPt = pt;

        const d = diamondDots[idx];
        if (d && d.pHeadphone) {
          dragOffset = {
            x: pt.x - d.pHeadphone.x,
            y: pt.y - d.pHeadphone.y,
          };
        }
      }

      const editorBar = document.getElementById('headphone-editor-bar');
      const hintText = document.getElementById('editor-hint-text');
      if (editorBar) {
        editorBar.style.display = (tSec >= 184.0) ? 'flex' : 'none';
        if (hintText && group === 'diamond') {
          const d = diamondDots[idx];
          hintText.textContent = `Выбран кружочек (${getColorName(d.color)} №${idx + 1}). Тяните мышкой или используйте стрелки клавиатуры!`;
          hintText.style.color = '#fde047';
        }
      }
    };

    // Keyboard Arrow Keys Support (▲ ▼ ◀ ▶, с зажатым Shift шаг 24px)
    window.addEventListener('keydown', (e) => {
      if (!selectedDotInfo || selectedDotInfo.group !== 'diamond') return;
      const tSec = currentT * 185.0;
      if (tSec < 184.0) return;

      const step = e.shiftKey ? 4 : 1; // Shift = 24px, обычный = 6px

      if (e.key === 'ArrowUp') {
        onNudgeDot(0, -step);
        e.preventDefault();
      } else if (e.key === 'ArrowDown') {
        onNudgeDot(0, step);
        e.preventDefault();
      } else if (e.key === 'ArrowLeft') {
        onNudgeDot(-step, 0);
        e.preventDefault();
      } else if (e.key === 'ArrowRight') {
        onNudgeDot(step, 0);
        e.preventDefault();
      }
    });

    const svgElem = document.querySelector('svg');
    svgElem.addEventListener('pointerdown', (e) => {
      // Клик по пустому полю сбрасывает выбор
      if (e.target.tagName !== 'circle') {
        selectedDotInfo = null;
        updateSelectionRing();
        const hintText = document.getElementById('editor-hint-text');
        if (hintText) {
          hintText.textContent = 'Кликните кружочек для перемещения';
          hintText.style.color = '#94a3b8';
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown || dragDotIdx === null) return;
      const pt = getSvgPoint(e);

      // Порог для старта перетаскивания (3px), чтобы обычный клик не смещал точку
      const dist = Math.hypot(pt.x - dragStartPt.x, pt.y - dragStartPt.y);
      if (!isDragging && dist > 3) {
        isDragging = true;
      }

      if (isDragging) {
        const d = diamondDots[dragDotIdx];
        if (d && d.pHeadphone) {
          let newX = pt.x - dragOffset.x;
          let newY = pt.y - dragOffset.y;

          // Мягкое магнитное прилипание при приближении к линии других точек (в пределах 3px)
          const rowMatch = diamondDots.find((other, oi) => oi !== dragDotIdx && other.pHeadphone && Math.abs(other.pHeadphone.y - newY) < 3.0);
          if (rowMatch) newY = rowMatch.pHeadphone.y;

          const colMatch = diamondDots.find((other, oi) => oi !== dragDotIdx && other.pHeadphone && Math.abs(other.pHeadphone.x - newX) < 3.0);
          if (colMatch) newX = colMatch.pHeadphone.x;

          d.pHeadphone.x = newX;
          d.pHeadphone.y = newY;
          updateDotHpTrack(d);

          updateUI(currentT);
          updateSelectionRing();
        }
      }
    });

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
      isDragging = false;
      dragDotIdx = null;
    });

    function getSvgPoint(e) {
      const rect = svgElem.getBoundingClientRect();
      const scaleX = SVG_W / rect.width;
      const scaleY = SVG_H / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY,
      };
    }

    function onDotClick(event, group, idx) {
      if (event) event.stopPropagation();
    }

    // Initial render in State 0
    updateUI(0.0);
  </script>
</body>

</html>
