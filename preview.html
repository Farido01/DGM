<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Grid Layout Design - Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #090a0f;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #app-layout {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #090a0f;
    }

    #stadium-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px 0 12px;
      overflow: hidden;
    }

    #svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    /* ── Bottom Control Station (Placed fully BELOW the stadium) ── */
    .bottom-controls-panel {
      width: 100%;
      background: #111422;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
      user-select: none;
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.6);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .btn {
      background: transparent;
      color: #cbd5e1;
      border: none;
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn.active {
      background: #7c3aed;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-play {
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-play:hover {
      background: rgba(99, 102, 241, 0.32);
      color: #ffffff;
    }

    .btn-play.playing {
      background: #ef4444;
      border-color: #f87171;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.45);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 12px;
    }

    .slider-wrap input[type=range] {
      width: 120px;
      accent-color: #8b5cf6;
      cursor: pointer;
    }

    /* ── Headphone Editor Sub-Bar ── */
    .headphone-editor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      animation: fadeIn 0.2s ease;
    }

    .editor-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7dd3fc;
      font-weight: 600;
    }

    .btn-tool {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-action {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid #818cf8;
      color: #c7d2fe;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11.5px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-action:hover {
      background: rgba(99, 102, 241, 0.4);
      color: #fff;
    }
    .btn-action.danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: #f87171;
      color: #fca5a5;
    }
    .btn-action.danger:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #fff;
    }

    /* Toast Notification */
    .toast-notify {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(56, 189, 248, 0.4);
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast-notify.show {
      opacity: 1;
      transform: translateX(-50%) translateY(6px);
    }

    /* ── Floating Dot Info Card ── */
    .dot-card {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 290px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
      color: #f8fafc;
      padding: 10px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 1000;
      animation: cardFadeIn 0.2s ease-out;
      user-select: none;
    }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .dot-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .dot-card-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .dot-card-icon {
      font-size: 16px;
    }
    .dot-card-title {
      font-weight: 700;
      font-size: 13.5px;
      color: #38bdf8;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .dot-card-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .dot-card-close:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .dot-card-body {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .dot-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }
    .dot-card-label {
      color: #94a3b8;
      font-weight: 400;
    }
    .dot-card-val {
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-card-val-badge {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      font-family: monospace;
    }
    .dot-card-val-dim {
      font-family: monospace;
      color: #cbd5e1;
      font-size: 11.5px;
    }
    .color-swatch {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.7);
    }
    .interactive-dot {
      cursor: pointer;
      transition: r 0.15s ease, filter 0.15s ease;
      pointer-events: all;
    }
    .interactive-dot:hover {
      r: 6.5px !important;
      filter: drop-shadow(0 0 7px #38bdf8) brightness(1.3);
    }
    #selection-layer {
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app-layout">
    <!-- 1. Stadium Area (100% visible, completely clear of buttons) -->
    <div id="stadium-container">
      <div id="svg-container">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#222" stroke-width="0.5" />
            </pattern>
          </defs>

          <!-- Field Background & Border -->
          <rect id="field-bg" fill="#18181b" />
          <rect id="field-border" fill="none" stroke="#555" stroke-width="1.5" />

          <!-- Axes / Lines -->
          <g id="axes-layer"></g>

          <!-- Labels -->
          <g id="labels-layer"></g>

          <!-- Guide outlines -->
          <g id="guides-layer"></g>

          <!-- Dynamic Performers Layers -->
          <g id="diag-layer"></g>
          <g id="circle-layer"></g>
          <g id="diamond-layer"></g>
          <g id="selection-layer"></g>
        </svg>
      </div>

      <!-- Toast Notification for Swapping / Moving -->
      <div id="toast-notify" class="toast-notify">✨ Точки успешно поменяны местами!</div>

      <!-- Compact Floating Dot Info Card -->
      <div id="dot-info-card" class="dot-card" style="display: none;">
        <div class="dot-card-header">
          <div class="dot-card-title-wrap">
            <span id="card-dot-icon" class="dot-card-icon">👤</span>
            <span id="card-dot-title" class="dot-card-title">Имя участника</span>
          </div>
          <button class="dot-card-close" onclick="closeDotCard()" title="Закрыть">✕</button>
        </div>
        <div class="dot-card-body">
          <div class="dot-card-row">
            <span class="dot-card-label">Группа:</span>
            <span id="card-dot-group" class="dot-card-val">2-й Круг (R=7)</span>
          </div>
          <div class="dot-card-row">
            <span class="dot-card-label">Цвет:</span>
            <span id="card-dot-color-wrap" class="dot-card-val">
              <span id="card-dot-swatch" class="color-swatch"></span>
              <span id="card-dot-color-name">Красный</span>
            </span>
          </div>
          <div class="dot-card-row">
            <span class="dot-card-label">Координаты:</span>
            <span id="card-dot-grid" class="dot-card-val-badge">Кол: 3.0R | Ряд: 27</span>
          </div>
          <div class="dot-card-row">
            <span class="dot-card-label">SVG (X, Y):</span>
            <span id="card-dot-svg" class="dot-card-val-dim">824.0, 336.0 px</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Bottom Control Station (Placed fully BELOW the stadium) -->
    <div id="bottom-controls" class="bottom-controls-panel">
      <!-- Row 1: Timeline Mode Buttons & Player Controls -->
      <div class="controls-row">
        <div class="btn-group">
          <button class="btn active" id="btn-draw0" onclick="setMode(0.0000)">Старт (0с)</button>
          <button class="btn" id="btn-draw1" onclick="setMode(34.5 / 185.0)">Вход кругов (34.5с)</button>
          <button class="btn" id="btn-draw2" onclick="setMode(60.0 / 185.0)">4 круга (1:00)</button>
          <button class="btn" id="btn-draw3" onclick="setMode(68.0 / 185.0)">Вход дуг (1:08)</button>
          <button class="btn" id="btn-draw4" onclick="setMode(84.0 / 185.0)">3 дуги (1:24)</button>
          <button class="btn" id="btn-draw5" onclick="setMode(120.0 / 185.0)">Переход (2:00)</button>
          <button class="btn" id="btn-draw6" onclick="setMode(134.0 / 185.0)">В ромбы (2:14)</button>
          <button class="btn" id="btn-draw7" onclick="setMode(165.0 / 185.0)">Ромбы (2:45)</button>
          <button class="btn" id="btn-draw8" onclick="setMode(1.0000)">Наушники (3:05)</button>
        </div>

        <div class="player-controls">
          <button class="btn-play" id="btn-play" onclick="togglePlay()">
            <span id="play-icon">▶</span> <span id="play-text">Запустить с музыкой (3:05)</span>
          </button>

          <button class="btn" id="btn-mute" onclick="toggleMute()" title="Включить / выключить звук" style="padding: 6px 9px; font-size: 13px;">
            <span id="mute-icon">🔊</span>
          </button>

          <div class="slider-wrap">
            <span id="time-display" style="min-width: 50px; font-variant-numeric: tabular-nums;">0.0с</span>
            <input type="range" id="progress-slider" min="0" max="1850" value="0" oninput="onSlider(this.value)">
            <span>3:05.0</span>
          </div>
        </div>
      </div>

      <!-- Row 2: Headphone Fast Edit & Swap Bar (Shown during Headphones mode) -->
      <div id="headphone-editor-bar" class="headphone-editor-bar" style="display: none;">
        <div class="editor-badge">
          <span>🎧 Редактор Наушников:</span>
          <span id="editor-hint-text" style="color: #94a3b8; font-weight: normal;">Кликните кружочек для перемещения или обмена</span>
        </div>
        <div id="selected-dot-tools" style="display: flex; align-items: center; gap: 8px;">
          <div style="display: flex; gap: 3px;">
            <button class="btn-tool" onclick="onNudgeDot(0, -1)" title="Сдвиг Вверх">▲ Вверх</button>
            <button class="btn-tool" onclick="onNudgeDot(0, 1)" title="Сдвиг Вниз">▼ Вниз</button>
            <button class="btn-tool" onclick="onNudgeDot(-1, 0)" title="Сдвиг Влево">◀ Влево</button>
            <button class="btn-tool" onclick="onNudgeDot(1, 0)" title="Сдвиг Вправо">▶ Вправо</button>
          </div>
          <button class="btn-action" onclick="onResetSelectedDot()">↩️ Сбросить точку</button>
          <button class="btn-action danger" onclick="onResetAllHeadphones()">♻️ Сбросить все наушники</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="bg-audio" src="DUSHANBE-3.wav" preload="auto"></audio>

  <script>
    // ── Field geometry ──────────────────────────────────────────────────────────
    const COLS = 56, ROWS = 36, STEP = 24;
    const DOT_R = 1, LABEL_PAD = 30, FONT_SIZE = 12;
    const FIELD_W = COLS * STEP, FIELD_H = ROWS * STEP;
    const SVG_W = 1920, SVG_H = 1080;
    const TOTAL_W = LABEL_PAD + FIELD_W + LABEL_PAD;
    const TOTAL_H = LABEL_PAD + FIELD_H + LABEL_PAD;
    const BX = (SVG_W - TOTAL_W) / 2;
    const BY = (SVG_H - TOTAL_H) / 2;
    const FX = BX + LABEL_PAD;
    const FY = BY + LABEL_PAD;

    const R_D = 3;    // diamond circle radius (diameter 6px)
    const R_S = 3;    // circle dots radius (diameter 6px)
    const R_LINE = 3; // diagonal line circle radius (diameter 6px)

    const RED = "#EF4444", YELLOW = "#F59E0B";
    const GREEN = "#22C55E", PINK_GRAY = "#C4A0B5";
    const BLACK_SQ = "#1E293B", PURPLE = "#9333EA";
    const FONT = "'Inter', system-ui, sans-serif";
    const TEXT_COLOR = "#FFFFFF", DOT_COLOR = "#0e00aa";

    const gx = (c) => FX + c * STEP;
    const gy = (r) => FY + r * STEP;
    const colR = (l) => 28 + l;
    const colL = (l) => 28 - l;
    const rowJ = (l) => ROWS - l;

    const INSET = 10 * Math.sqrt(2);

    // Right outer
    const RT = { x: gx(colR(14)), y: gy(rowJ(10)) };
    const RR = { x: gx(colR(18)), y: gy(rowJ(6)) };
    const RB = { x: gx(colR(14)), y: gy(rowJ(2)) };
    const RL = { x: gx(colR(10)), y: gy(rowJ(6)) };
    // Right inner
    const RIT = { x: RT.x, y: RT.y + INSET };
    const RIR = { x: RR.x - INSET, y: RR.y };
    const RIB = { x: RB.x, y: RB.y - INSET };
    const RIL = { x: RL.x + INSET, y: RL.y };

    // Left outer
    const LT = { x: gx(colL(14)), y: gy(rowJ(10)) };
    const LR = { x: gx(colL(10)), y: gy(rowJ(6)) };
    const LB = { x: gx(colL(14)), y: gy(rowJ(2)) };
    const LL = { x: gx(colL(18)), y: gy(rowJ(6)) };
    // Left inner
    const LIT = { x: LT.x, y: LT.y + INSET };
    const LIR = { x: LR.x - INSET, y: LR.y };
    const LIB = { x: LB.x, y: LB.y - INSET };
    const LIL = { x: LL.x + INSET, y: LL.y };

    function sidePts(a, b, n = 10) {
      return Array.from({ length: n }, (_, i) => ({
        x: a.x + (b.x - a.x) * (i + 1) / (n + 1),
        y: a.y + (b.y - a.y) * (i + 1) / (n + 1),
      }));
    }

    function linePts(a, b, n) {
      return Array.from({ length: n }, (_, i) => ({
        x: a.x + (b.x - a.x) * i / (n - 1),
        y: a.y + (b.y - a.y) * i / (n - 1),
      }));
    }

    function circPts(cx, cy, r, n) {
      return Array.from({ length: n }, (_, i) => {
        const a = (2 * Math.PI * i) / n;
        return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
      });
    }

    const CIRC_CX = gx(28);
    const CIRC_CY = gy(rowJ(15)); // Center shifted 1 row down to 0:15
    const CIRC_R = 10 * STEP;
    const CIRC_N = 140;

    // Big circle open at the bottom between column 2L and 2R (140 dots)
    // When openCols = 0, forms a fully closed 360-degree circle
    function openCircPts(cx, cy, r, n = 140, openCols = 2) {
      if (openCols <= 0.001) {
        return Array.from({ length: n }, (_, i) => {
          const a = (Math.PI / 2) + (2 * Math.PI * i) / n;
          return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
        });
      }
      const openAngle = Math.asin(openCols / (r / STEP));
      const startAngle = Math.PI / 2 + openAngle; // Opens at the bottom between 2L and 2R
      const totalArc = 2 * Math.PI - 2 * openAngle;
      return Array.from({ length: n }, (_, i) => {
        const a = startAngle + (totalArc * i) / (n - 1);
        return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
      });
    }

    const polyStr = (...ps) => ps.map(p => `${p.x},${p.y}`).join(" ");

    const rightOuter = [
      { a: RT, b: RR, color: YELLOW },
      { a: RR, b: RB, color: RED },
      { a: RB, b: RL, color: PINK_GRAY },
      { a: RL, b: RT, color: GREEN },
    ];
    const rightInner = [
      { a: RIT, b: RIR, color: YELLOW },
      { a: RIR, b: RIB, color: RED },
      { a: RIB, b: RIL, color: PINK_GRAY },
      { a: RIL, b: RIT, color: GREEN },
    ];
    const leftOuter = [
      { a: LT, b: LL, color: YELLOW },
      { a: LL, b: LB, color: RED },
      { a: LB, b: LR, color: PINK_GRAY },
      { a: LR, b: LT, color: GREEN },
    ];
    const leftInner = [
      { a: LIT, b: LIL, color: YELLOW },
      { a: LIL, b: LIB, color: RED },
      { a: LIB, b: LIR, color: PINK_GRAY },
      { a: LIR, b: LIT, color: GREEN },
    ];

    // ── 2nd Circle & 3rd Circle: Progressive Gap from Big Circle starting at Row 16 ──
    // 2-й круг: открыт сверху (2..2) и снизу (2.2..2.2)
    // 3-й круг: СВЕРХУ ПОЛНОСТЬЮ ЗАКРЫТ, открыт только снизу (2.2..2.2). Зазор строго 10px.
    const R_IN1_BASE = 8.5 * STEP; // 204px (зазор 36px сбоку на 16 ряду)

    const diamondDots = [];

    function buildMasterTrack(isRight, isInnerRing, sides) {
      const isGoingToInner = (sides === rightInner || sides === leftInner);

      const exitCol = isGoingToInner ? 1.4 : 0.9;
      const exitRow = isGoingToInner ? 4.5 : 4.1; // Shifted 1 row down with circle
      const exitX = isRight ? gx(colR(exitCol)) : gx(colL(exitCol));
      const exitY = gy(rowJ(exitRow));

      const midAngle = isRight ? 0 : Math.PI;

      // Helper to compute circle point at angle a
      function getCirclePt(a) {
        const da = Math.abs(a - midAngle);
        const fr = Math.min(1, da / (Math.PI / 2));
        const off = 1.15 * STEP * Math.pow(fr, 1.25);
        const r = (R_IN1_BASE - off) - (isInnerRing ? 10 : 0);
        return {
          x: CIRC_CX + r * Math.cos(a),
          y: CIRC_CY + r * Math.sin(a),
        };
      }

      // Угол нижнего выхода a0 точно соответствует колонке выхода (1.4 для 2-го круга, 0.9 для 3-го)
      const rAtExit = (R_IN1_BASE - 1.15 * STEP) - (isInnerRing ? 10 : 0);
      const botAngle = Math.asin(Math.min(1, (exitCol * STEP) / rAtExit));
      const topAngle = Math.asin(Math.min(1, (2.0 * STEP) / (R_IN1_BASE - 1.15 * STEP)));

      const a0 = isRight ? (Math.PI / 2 - botAngle) : (Math.PI / 2 + botAngle);
      const a3 = isRight ? (-Math.PI / 2 + 0.70) : (3 * Math.PI / 2 - 0.70);
      const stepA = (a3 - a0) / 3;
      const a1 = a0 + stepA;
      const a2 = a0 + 2 * stepA;

      let aTop;
      if (!isInnerRing) {
        aTop = isRight ? (-Math.PI / 2 + topAngle) : (3 * Math.PI / 2 - topAngle);
      } else {
        aTop = isRight ? (-Math.PI / 2) : (3 * Math.PI / 2);
      }

      const trackPts = [];

      // 1. Движение по кругу вниз к выходу a0 (верхние точки немного закрываются/смещаются по дуге вниз)
      const ARC_STEPS = 60;
      for (let s = 0; s <= ARC_STEPS; s++) {
        const a = aTop + (a0 - aTop) * (s / ARC_STEPS);
        trackPts.push(getCirclePt(a));
      }

      // 2. Движение по ПРЯМОЙ ВЕРТИКАЛЬНОЙ ЛИНИИ ВНИЗ к ряду 5.5 / 5.1
      const ptAtA0 = trackPts[trackPts.length - 1];
      const DOWN_STEPS = 15;
      for (let s = 1; s <= DOWN_STEPS; s++) {
        const u = s / DOWN_STEPS;
        trackPts.push({
          x: ptAtA0.x + (exitX - ptAtA0.x) * u, // строго вертикально
          y: ptAtA0.y + (exitY - ptAtA0.y) * u, // прямо вниз
        });
      }

      // 3. Коридор к ромбу (в точке 10:6 делаем увеличенный свободный зазор 15px, чтобы зазор был хорошо виден)
      const diamondEntry = sides[3].a; // RL for outer, RIL for inner
      const CORR_STEPS = 35;
      const GAP_AT_10_6 = 15; // px увеличенный зазор в точке 10:6

      for (let s = 1; s <= CORR_STEPS; s++) {
        const u = s / CORR_STEPS;
        const targetX = exitX + (diamondEntry.x - exitX) * u;
        const targetY = isGoingToInner
          ? (u < 0.85
              ? exitY + (diamondEntry.y - GAP_AT_10_6 - exitY) * (u / 0.85)
              : (diamondEntry.y - GAP_AT_10_6) + GAP_AT_10_6 * ((u - 0.85) / 0.15))
          : exitY + (diamondEntry.y - exitY) * u;
        trackPts.push({ x: targetX, y: targetY });
      }

      // 4. Diamond perimeter loop: sides[3].a (entry) -> sides[1].b -> sides[1].a -> sides[0].a -> sides[3].a
      const v_entry = sides[3].a; // RL / RIL
      const v_bot   = sides[1].b; // RB / RIB
      const v_right = sides[1].a; // RR / RIR
      const v_top   = sides[0].a; // RT / RIT

      function addLinearSeg(pA, pB, count = 20) {
        for (let s = 1; s <= count; s++) {
          const u = s / count;
          trackPts.push({
            x: pA.x + (pB.x - pA.x) * u,
            y: pA.y + (pB.y - pA.y) * u,
          });
        }
      }

      addLinearSeg(v_entry, v_bot, 20);   // Side 1: 10:6 -> 14:2 (Pink-Gray)
      addLinearSeg(v_bot, v_right, 20);  // Side 2: 14:2 -> 18:6 (Red)
      addLinearSeg(v_right, v_top, 20);  // Side 3: 18:6 -> 14:10 (Yellow)
      addLinearSeg(v_top, v_entry, 20);  // Side 4: 14:10 -> 10:6 (Green)

      // Compute cumulative distances
      const trackDists = [0];
      let totalD = 0;
      for (let i = 0; i < trackPts.length - 1; i++) {
        totalD += Math.hypot(trackPts[i+1].x - trackPts[i].x, trackPts[i+1].y - trackPts[i].y);
        trackDists.push(totalD);
      }

      return {
        trackPts,
        trackDists,
        totalD,
        a0, a1, a2, a3, aTop,
        getCirclePt,
        v_entry, v_bot, v_right, v_top,
      };
    }

    function findTrackDist(trackPts, trackDists, targetPt, hintStartIdx = 0, hintEndIdx = trackPts.length - 1) {
      let bestDist = 0;
      let minDistSq = Infinity;
      for (let i = hintStartIdx; i < hintEndIdx; i++) {
        const pA = trackPts[i];
        const pB = trackPts[i + 1];
        const dx = pB.x - pA.x;
        const dy = pB.y - pA.y;
        const lenSq = dx * dx + dy * dy;
        let u = 0;
        if (lenSq > 0) {
          u = ((targetPt.x - pA.x) * dx + (targetPt.y - pA.y) * dy) / lenSq;
          u = Math.max(0, Math.min(1, u));
        }
        const projX = pA.x + u * dx;
        const projY = pA.y + u * dy;
        const distSq = (targetPt.x - projX) ** 2 + (targetPt.y - projY) ** 2;
        if (distSq < minDistSq) {
          minDistSq = distSq;
          bestDist = trackDists[i] + u * Math.hypot(dx, dy);
        }
      }
      return bestDist;
    }

    function getPointAtDist(trackPts, trackDists, d) {
      if (d <= 0) return trackPts[0];
      const maxD = trackDists[trackDists.length - 1];
      if (d >= maxD) return trackPts[trackPts.length - 1];

      let low = 0, high = trackDists.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (trackDists[mid] <= d) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      const idx = Math.max(0, high);
      const d0 = trackDists[idx];
      const d1 = trackDists[idx + 1];
      const frac = (d1 > d0) ? (d - d0) / (d1 - d0) : 0;
      const p0 = trackPts[idx];
      const p1 = trackPts[idx + 1];
      return {
        x: p0.x + (p1.x - p0.x) * frac,
        y: p0.y + (p1.y - p0.y) * frac,
      };
    }

    function buildDiamondGroup(isRight, isInnerRing, sides) {
      const track = buildMasterTrack(isRight, isInnerRing, sides);
      const { trackPts, trackDists, a0, a1, a2, a3, aTop, getCirclePt, v_entry, v_bot, v_right, v_top } = track;

      const diamondStartIndex = 60 + 15 + 25; // Index where diamond loop starts in trackPts

      // 4 color groups in order from leader (Green) to caboose (Pink-Gray)
      const colorConfigs = [
        {
          color: GREEN,
          order: 0,
          fromA: a0,
          toA: a1,
          sidePtsArr: sidePts(v_top, v_entry, 10), // Side 4: 14:10 -> 10:6
        },
        {
          color: YELLOW,
          order: 1,
          fromA: a1,
          toA: a2,
          sidePtsArr: sidePts(v_right, v_top, 10), // Side 3: 18:6 -> 14:10
        },
        {
          color: RED,
          order: 2,
          fromA: a2,
          toA: a3,
          sidePtsArr: sidePts(v_bot, v_right, 10), // Side 2: 14:2 -> 18:6
        },
        {
          color: PINK_GRAY,
          order: 3,
          fromA: a3,
          toA: aTop,
          sidePtsArr: sidePts(v_entry, v_bot, 10), // Side 1: 10:6 -> 14:2
        },
      ];

      colorConfigs.forEach(({ color, order, fromA, toA, sidePtsArr }) => {
        for (let idx = 0; idx < 10; idx++) {
          const angle = fromA + (toA - fromA) * (idx / 9);
          const p0 = getCirclePt(angle);
          const p1 = sidePtsArr[9 - idx]; // Leader (idx=0) walks furthest to end of side

          const s0 = findTrackDist(trackPts, trackDists, p0, 0, 60);
          const s1 = findTrackDist(trackPts, trackDists, p1, diamondStartIndex, trackPts.length - 1);

          diamondDots.push({
            p0,
            p1,
            s0,
            s1,
            trackPts,
            trackDists,
            color,
            order,
            idx,
            isRight,
            isInnerRing,
          });
        }
      });
    }

    // Внешний 2-й круг переходит во ВНУТРЕННИЙ ромб
    // Внутренний 3-й круг переходит во ВНЕШНИЙ ромб
    buildDiamondGroup(true, false, rightInner); // 2nd Circle (Outer in circle) -> Inner Diamond
    buildDiamondGroup(true, true, rightOuter);  // 3rd Circle (Inner in circle) -> Outer Diamond
    buildDiamondGroup(false, false, leftInner); // 2nd Circle (Outer in circle) -> Inner Diamond
    buildDiamondGroup(false, true, leftOuter);  // 3rd Circle (Inner in circle) -> Outer Diamond

    // ── Позиции в Исходном состоянии (Рисунок 0, t = 0: 4 концентрических круга) ──
    // 1-й круг: R = 10 (140 точек, полностью закрытый снизу)
    // 2-й круг: R = 7 (100 точек: 50 слева, 50 справа) — ЗАКРЫТ СВЕРХУ 20 розово-серыми точками!
    // 3-й круг: R = 4 (50 точек: 25 слева, 25 справа) — закрыт снизу
    // 4-й круг: R = 1 (10 красных точек: 5 слева, 5 справа) — самый внутренний круг
    function getCircleHalfPt(r, index, count, isRight) {
      // index = 0 (снизу) ... count - 1 (сверху)
      const a = isRight
        ? (Math.PI / 2 - Math.PI * (index + 0.5) / count)
        : (Math.PI / 2 + Math.PI * (index + 0.5) / count);
      return {
        x: CIRC_CX + r * Math.cos(a),
        y: CIRC_CY + r * Math.sin(a),
      };
    }

    diamondDots.forEach(d => {
      let pInit;
      if (!d.isInnerRing) {
        // 2-й круг (rightInner / leftInner) — 40 точек на 2-м круге R=7:
        if (d.color === GREEN) {
          // 10 Green снизу (индексы 0..9)
          pInit = getCircleHalfPt(7 * STEP, d.idx, 50, d.isRight);
        } else if (d.color === YELLOW) {
          // 10 Yellow (индексы 10..19)
          pInit = getCircleHalfPt(7 * STEP, 10 + d.idx, 50, d.isRight);
        } else if (d.color === RED) {
          // 10 Red (индексы 20..29)
          pInit = getCircleHalfPt(7 * STEP, 20 + d.idx, 50, d.isRight);
        } else if (d.color === PINK_GRAY) {
          // 10 Pink-Gray (индексы 30..39)
          pInit = getCircleHalfPt(7 * STEP, 30 + d.idx, 50, d.isRight);
        }
      } else {
        // 3-й круг (rightOuter / leftOuter):
        if (d.color === PINK_GRAY) {
          // 10 Pink-Gray на САМОМ ВЕРХУ 2-го круга R=7 (индексы 40..49) — ЗАКРЫВАЮТ ВЕРХ!
          pInit = getCircleHalfPt(7 * STEP, 40 + d.idx, 50, d.isRight);
        } else if (d.color === GREEN) {
          // 10 Green на 3-м круге R=4 (индексы 0..9)
          pInit = getCircleHalfPt(4 * STEP, d.idx, 25, d.isRight);
        } else if (d.color === YELLOW) {
          // 10 Yellow на 3-м круге R=4 (индексы 10..19)
          pInit = getCircleHalfPt(4 * STEP, 10 + d.idx, 25, d.isRight);
        } else if (d.color === RED) {
          if (d.idx < 5) {
            // 5 Red на 3-м круге R=4 (индексы 20..24)
            pInit = getCircleHalfPt(4 * STEP, 20 + d.idx, 25, d.isRight);
          } else {
            // 5 Red в 4-м самом внутреннем круге R=1 (индексы 0..4) — 4-й круг!
            pInit = getCircleHalfPt(1 * STEP, d.idx - 5, 5, d.isRight);
          }
        }
      }
      d.pInit = pInit || d.p0;
    });

    // ── Позиции в Фигуре «Наушники» (переход 2:50..3:05, 80 точек слева, 80 точек справа) ──
    // ЕДИНЫЕ НЕПРЕРЫВНЫЕ МАСТЕР-ДУГИ С ИДЕАЛЬНО РАВНОМЕРНЫМ ШАГОМ И ПОСТОЯННЫМ ЗАЗОРОМ 0.70
    function buildHeadphoneGeometry() {
      const N = 1000;
      
      // 1. Внешний непрерывный контур (35 точек: 10 зеленых + 15 желтых + 10 красных)
      const outerPoly = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        let c, r;
        if (t <= 0.38) {
          const u = t / 0.38;
          const p0 = {c: 11.0, r: 7.0}, p1 = {c: 13.5, r: 7.7}, p2 = {c: 16.2, r: 7.3}, p3 = {c: 17.0, r: 5.8};
          const v = 1 - u;
          c = v*v*v*p0.c + 3*v*v*u*p1.c + 3*v*u*u*p2.c + u*u*u*p3.c;
          r = v*v*v*p0.r + 3*v*v*u*p1.r + 3*v*u*u*p2.r + u*u*u*p3.r;
        } else if (t <= 0.62) {
          const u = (t - 0.38) / 0.24;
          c = 17.0;
          r = 5.8 - (5.8 - 3.2) * u;
        } else {
          const u = (t - 0.62) / 0.38;
          const p0 = {c: 17.0, r: 3.2}, p1 = {c: 16.2, r: 1.7}, p2 = {c: 13.5, r: 1.3}, p3 = {c: 11.0, r: 2.0};
          const v = 1 - u;
          c = v*v*v*p0.c + 3*v*v*u*p1.c + 3*v*u*u*p2.c + u*u*u*p3.c;
          r = v*v*v*p0.r + 3*v*v*u*p1.r + 3*v*u*u*p2.r + u*u*u*p3.r;
        }
        outerPoly.push({ c, r });
      }

      const outerDists = [0];
      for (let i = 1; i < outerPoly.length; i++) {
        const dc = outerPoly[i].c - outerPoly[i-1].c;
        const dr = outerPoly[i].r - outerPoly[i-1].r;
        outerDists.push(outerDists[i-1] + Math.hypot(dc, dr));
      }
      const outerLen = outerDists[outerDists.length - 1];

      const outer35 = [];
      for (let i = 0; i < 35; i++) {
        const targetDist = (i / 34) * outerLen;
        let low = 0, high = outerDists.length - 1;
        while (low <= high) {
          const mid = (low + high) >> 1;
          if (outerDists[mid] <= targetDist) low = mid + 1;
          else high = mid - 1;
        }
        const idx = Math.max(0, high);
        const d0 = outerDists[idx];
        const d1 = outerDists[idx + 1] || d0;
        const frac = d1 > d0 ? (targetDist - d0) / (d1 - d0) : 0;
        const p0 = outerPoly[idx];
        const p1 = outerPoly[idx + 1] || p0;
        outer35.push({
          c: p0.c + (p1.c - p0.c) * frac,
          r: p0.r + (p1.r - p0.r) * frac
        });
      }

      // 2. Внутренний непрерывный контур (25 точек: 10 зеленых + 5 желтых + 10 красных)
      const innerPoly = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        let c, r;
        if (t <= 0.38) {
          const u = t / 0.38;
          const p0 = {c: 11.0, r: 6.3}, p1 = {c: 13.5, r: 7.0}, p2 = {c: 15.6, r: 6.7}, p3 = {c: 16.3, r: 6.0};
          const v = 1 - u;
          c = v*v*v*p0.c + 3*v*v*u*p1.c + 3*v*u*u*p2.c + u*u*u*p3.c;
          r = v*v*v*p0.r + 3*v*v*u*p1.r + 3*v*u*u*p2.r + u*u*u*p3.r;
        } else if (t <= 0.62) {
          const u = (t - 0.38) / 0.24;
          c = 16.3;
          r = 6.0 - (6.0 - 3.0) * u;
        } else {
          const u = (t - 0.62) / 0.38;
          const p0 = {c: 16.3, r: 3.0}, p1 = {c: 15.6, r: 2.3}, p2 = {c: 13.5, r: 2.0}, p3 = {c: 11.0, r: 2.7};
          const v = 1 - u;
          c = v*v*v*p0.c + 3*v*v*u*p1.c + 3*v*u*u*p2.c + u*u*u*p3.c;
          r = v*v*v*p0.r + 3*v*v*u*p1.r + 3*v*u*u*p2.r + u*u*u*p3.r;
        }
        innerPoly.push({ c, r });
      }

      const innerDists = [0];
      for (let i = 1; i < innerPoly.length; i++) {
        const dc = innerPoly[i].c - innerPoly[i-1].c;
        const dr = innerPoly[i].r - innerPoly[i-1].r;
        innerDists.push(innerDists[i-1] + Math.hypot(dc, dr));
      }
      const innerLen = innerDists[innerDists.length - 1];

      const inner25 = [];
      for (let i = 0; i < 25; i++) {
        const targetDist = (i / 24) * innerLen;
        let low = 0, high = innerDists.length - 1;
        while (low <= high) {
          const mid = (low + high) >> 1;
          if (innerDists[mid] <= targetDist) low = mid + 1;
          else high = mid - 1;
        }
        const idx = Math.max(0, high);
        const d0 = innerDists[idx];
        const d1 = innerDists[idx + 1] || d0;
        const frac = d1 > d0 ? (targetDist - d0) / (d1 - d0) : 0;
        const p0 = innerPoly[idx];
        const p1 = innerPoly[idx + 1] || p0;
        inner25.push({
          c: p0.c + (p1.c - p0.c) * frac,
          r: p0.r + (p1.r - p0.r) * frac
        });
      }

      return { outer35, inner25 };
    }

    const headphoneGeo = buildHeadphoneGeometry();

    function getHeadphonePos(d) {
      const isRight = d.isRight;
      const isOuter = d.isInnerRing; // true = outer diamond, false = inner diamond
      const colFn = isRight ? colR : colL;
      const i = d.idx; // 0..9

      let c, r;
      if (d.color === GREEN) {
        if (isOuter) {
          // Внешняя зеленая дуга (10 точек, индексы 0..9 по внешнему контуру)
          const pt = headphoneGeo.outer35[i];
          c = pt.c;
          r = pt.r;
        } else {
          // Внутренняя зеленая дуга (10 точек, индексы 0..9 по внутреннему контуру)
          const pt = headphoneGeo.inner25[i];
          c = pt.c;
          r = pt.r;
        }
      } else if (d.color === YELLOW) {
        if (!isOuter) {
          if (i < 5) {
            // Внутренняя подушечка наушника (5 точек, индексы 10..14 по внутреннему контуру)
            const pt = headphoneGeo.inner25[10 + i];
            c = pt.c;
            r = pt.r;
          } else {
            // Нижняя часть внешней дуги (5 точек, индексы 20..24 по внешнему контуру)
            const pt = headphoneGeo.outer35[20 + (i - 5)];
            c = pt.c;
            r = pt.r;
          }
        } else {
          // Верхняя и средняя часть внешнего купола (10 точек, индексы 10..19 по внешнему контуру)
          const pt = headphoneGeo.outer35[10 + i];
          c = pt.c;
          r = pt.r;
        }
      } else if (d.color === RED) {
        if (isOuter) {
          // Внешняя красная дуга (10 точек, индексы 25..34 по внешнему контуру)
          const pt = headphoneGeo.outer35[25 + i];
          c = pt.c;
          r = pt.r;
        } else {
          // Внутренняя красная дуга (10 точек, индексы 15..24 по внутреннему контуру)
          const pt = headphoneGeo.inner25[15 + i];
          c = pt.c;
          r = pt.r;
        }
      } else if (d.color === PINK_GRAY) {
        // Двойная вертикальная стойка (колонки 12.8 и 13.5, постоянный зазор 0.70)
        if (isOuter) {
          c = 12.8;
          r = 2.8 + (6.2 - 2.8) * (i / 9);
        } else {
          c = 13.5;
          r = 2.8 + (6.2 - 2.8) * (i / 9);
        }
      }

      return {
        x: gx(colFn(c)),
        y: gy(rowJ(r)),
        defaultX: gx(colFn(c)),
        defaultY: gy(rowJ(r)),
      };
    }

    function makeHeadphoneTrack(pStart, pEnd, color, isInnerRing, isRight, idx) {
      const dx = pEnd.x - pStart.x;
      const dy = pEnd.y - pStart.y;
      
      let cp1 = { x: pStart.x + dx * 0.33, y: pStart.y + dy * 0.33 };
      let cp2 = { x: pEnd.x - dx * 0.33, y: pEnd.y - dy * 0.33 };

      if (color === RED) {
        // Красные: сразу делают шаг ВНИЗ И ВЛЕВО (в сторону центра поля), затем переходят в нижнюю дугу
        const stepDownY = isInnerRing ? 18 : 12;
        const stepLeftX = isRight ? -18 : 18;
        cp1 = {
          x: pStart.x + stepLeftX,
          y: pStart.y + stepDownY
        };
        cp2 = {
          x: pEnd.x + (isRight ? -8 : 8),
          y: pEnd.y + stepDownY * 0.35
        };
      } else if (color === GREEN) {
        // Зеленые: мягкая, плавная и красивая верхняя дуга
        const arcY = isInnerRing ? 16 : 10;
        cp1 = { x: pStart.x + dx * 0.35, y: pStart.y - arcY };
        cp2 = { x: pEnd.x - dx * 0.35, y: pEnd.y - arcY * 0.5 };
      } else if (color === YELLOW) {
        if (!isInnerRing && idx >= 5) {
          // 5 точек желтого внутреннего ромба: сразу делают шаг ВПРАВО И ВНИЗ, затем переходят во внешний купол
          const stepRightX = isRight ? 22 : -22;
          const stepDownY = 16;
          cp1 = {
            x: pStart.x + stepRightX,
            y: pStart.y + stepDownY
          };
          cp2 = {
            x: pEnd.x + (isRight ? 10 : -10),
            y: pEnd.y - 6
          };
        } else {
          // Остальные желтые точки купола и внутренней подушечки
          cp1 = { x: pStart.x + dx * 0.33, y: pStart.y + dy * 0.33 };
          cp2 = { x: pEnd.x - dx * 0.33, y: pEnd.y - dy * 0.33 };
        }
      } else if (color === PINK_GRAY) {
        // Розово-серые: мягкий прямой вход в вертикальные стойки
        cp1 = { x: pStart.x + dx * 0.35, y: pStart.y + dy * 0.25 };
        cp2 = { x: pEnd.x - dx * 0.25, y: pEnd.y - dy * 0.25 };
      }

      const pts = [];
      const N = 40;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const v = 1 - t;
        const x = v*v*v*pStart.x + 3*v*v*t*cp1.x + 3*v*t*t*cp2.x + t*t*t*pEnd.x;
        const y = v*v*v*pStart.y + 3*v*v*t*cp1.y + 3*v*t*t*cp2.y + t*t*t*pEnd.y;
        pts.push({ x, y });
      }

      const dists = [0];
      for (let i = 1; i < pts.length; i++) {
        dists.push(dists[i-1] + Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y));
      }

      return { pts, dists, totalLen: dists[dists.length - 1] };
    }

    function updateDotHpTrack(d) {
      if (!d || !d.p1 || !d.pHeadphone) return;
      const tr = makeHeadphoneTrack(d.p1, d.pHeadphone, d.color, d.isInnerRing, d.isRight, d.idx);
      d.hpTrackPts = tr.pts;
      d.hpTrackDists = tr.dists;
      d.hpTotalLen = tr.totalLen;
    }

    function initAllHeadphoneTracks() {
      diamondDots.forEach(d => {
        d.pHeadphone = getHeadphonePos(d);
        updateDotHpTrack(d);
      });
    }
    initAllHeadphoneTracks();

    // ── Позиции в Коробке для 1-го Круга (4x35: колонки 18, 18.5, 19, 19.5, ряд 28) ──
    const R1 = 10 * STEP; // R = 10 (240px)
    const deltaS1 = (2 * Math.PI * R1) / 140; // Точная дистанция 1-го круга = 10.7714px
    const yRow28 = gy(rowJ(28)); // Ряд 28 (296.0px)
    const colOffsets1 = [18.0, 18.5, 19.0, 19.5];

    // Точка захода 1-го круга: точно заданные SVG-координаты X: 1200.0px, Y: 607.3px
    const trackX1 = 1200.0;
    const entryY1 = 607.3;
    const a_entry1 = Math.atan2(entryY1 - CIRC_CY, trackX1 - CIRC_CX);

    // ── Позиции в Коробке для 2-го Круга (4x25 справа: 3.0, 2.5, 2.0, 1.5) ──
    const R2 = 7 * STEP;
    const deltaS = (2 * Math.PI * R2) / 100; // Точная дистанция между участниками 2-го круга = 10.556px
    const yRow27 = gy(rowJ(27)); // Ряд 27 сбоку

    // Точка входа 2-го круга: точно заданные SVG-координаты X: 1127.9px, Y: 606.7px
    const trackX = 1127.9;
    const entryY = 606.7;
    const a_entry = Math.atan2(entryY - CIRC_CY, trackX - CIRC_CX);

    const colOffsets2 = [3.0, 2.5, 2.0, 1.5];

    function getBoxPt(colRightOffset, k) {
      return {
        x: gx(colR(colRightOffset)),
        y: yRow27 - k * deltaS,
      };
    }

    // ── Позиции в Коробке для 3-го Круга (2x25 справа: 1.0 и 0.5) ──────────────
    const R3 = 4 * STEP; // R = 4 (96px)
    const deltaS3 = (2 * Math.PI * R3) / 50; // Точная дистанция 3-го круга = 12.064px

    // Точка входа 3-го круга: строго координата 4:15 (колонка 4R, ряд 15)
    const trackX3 = gx(colR(4.0));
    const entryY3 = gy(rowJ(15.0));
    const a_entry3 = 0; // Строго 3 часа на правом краю круга R=4

    const colOffsets3 = [1.0, 0.5];

    function getBoxPt3(colRightOffset, k) {
      return {
        x: gx(colR(colRightOffset)),
        y: yRow27 - k * deltaS3,
      };
    }

    // ── Позиции в Коробке для 4-го Круга (1x10 в колонке 0: 10 красных) ────────
    const R4 = 1 * STEP; // R = 1 (24px)
    const deltaS4 = (2 * Math.PI * R4) / 10; // Точная дистанция 4-го круга = 15.080px
    const trackX4 = gx(colR(1.0)); // Правый край 4-го круга (976.0px)
    const entryY4 = gy(rowJ(15.0)); // Ряд 15 (608.0px)
    const a_entry4 = 0; // 3 часа (согласовано со 2-м и 3-м кругами)

    function getBoxPt4(k) {
      return {
        x: CIRC_CX,
        y: yRow27 - k * deltaS4,
      };
    }

    // ── Геометрическое распределение участников по кругам и коробкам ────────────
    // Сохраняет подлинные координаты d.pInit (Рисунок 0) и обеспечивает 100% плавный переход в 2 круга (Рисунок 1)

    // 2-й Круг (100 точек):
    const circle2Dots = diamondDots.filter(d => !d.isInnerRing || (d.isInnerRing && d.color === PINK_GRAY));
    circle2Dots.forEach(d => {
      d.circleNum = 2;
      const a = Math.atan2(d.pInit.y - CIRC_CY, d.pInit.x - CIRC_CX);
      let da = a - a_entry;
      while (da <= 0.0001) da += 2 * Math.PI;
      while (da > 2 * Math.PI) da -= 2 * Math.PI;
      d.da = da;
    });
    circle2Dots.sort((a, b) => b.da - a.da);
    circle2Dots.forEach((d, m) => {
      d.trainIdx = m;
      const c = Math.floor(m / 25); // 0..3 (колонки 3.0, 2.5, 2.0, 1.5)
      const k = m % 25; // 0..24
      d.pBox = getBoxPt(colOffsets2[c], k);
    });

    // 3-й Круг (50 точек):
    const circle3Dots = diamondDots.filter(d => d.isInnerRing && (d.color === GREEN || d.color === YELLOW || (d.color === RED && d.idx < 5)));
    circle3Dots.forEach(d => {
      d.circleNum = 3;
      const a = Math.atan2(d.pInit.y - CIRC_CY, d.pInit.x - CIRC_CX);
      let da = a - a_entry3;
      while (da <= 0.0001) da += 2 * Math.PI;
      while (da > 2 * Math.PI) da -= 2 * Math.PI;
      d.da = da;
    });
    circle3Dots.sort((a, b) => b.da - a.da);
    circle3Dots.forEach((d, m) => {
      d.trainIdx3 = m;
      const c = Math.floor(m / 25); // 0..1 (колонки 1.0, 0.5)
      const k = m % 25; // 0..24
      d.pBox3 = getBoxPt3(colOffsets3[c], k);
    });

    // 4-й Круг (10 точек):
    const circle4Dots = diamondDots.filter(d => d.isInnerRing && d.color === RED && d.idx >= 5);
    circle4Dots.forEach(d => {
      d.circleNum = 4;
      const a = Math.atan2(d.pInit.y - CIRC_CY, d.pInit.x - CIRC_CX);
      let da = a - a_entry4;
      while (da <= 0.0001) da += 2 * Math.PI;
      while (da > 2 * Math.PI) da -= 2 * Math.PI;
      d.da = da;
    });
    circle4Dots.sort((a, b) => b.da - a.da);
    circle4Dots.forEach((d, m) => {
      d.trainIdx4 = m;
      d.pBox4 = getBoxPt4(m);
    });

    function createCatmullRomSpline(controlPoints, numSamples = 300) {
      const pts = [];
      const dists = [0];
      let totalD = 0;

      function catmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t;
        const t3 = t2 * t;
        const x = 0.5 * (
          (2 * p1.x) +
          (-p0.x + p2.x) * t +
          (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
          (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
        );
        const y = 0.5 * (
          (2 * p1.y) +
          (-p0.y + p2.y) * t +
          (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
          (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
        );
        return { x, y };
      }

      const numSegments = controlPoints.length - 3;
      const samplesPerSeg = Math.floor(numSamples / numSegments);

      for (let s = 0; s < numSegments; s++) {
        const p0 = controlPoints[s];
        const p1 = controlPoints[s + 1];
        const p2 = controlPoints[s + 2];
        const p3 = controlPoints[s + 3];

        const isLastSeg = (s === numSegments - 1);
        const count = isLastSeg ? (numSamples - s * samplesPerSeg) : samplesPerSeg;

        for (let i = 0; i < count; i++) {
          const t = i / count;
          const pt = catmullRom(p0, p1, p2, p3, t);
          pts.push(pt);
          if (pts.length > 1) {
            const prev = pts[pts.length - 2];
            totalD += Math.hypot(pt.x - prev.x, pt.y - prev.y);
            dists.push(totalD);
          }
        }
      }
      const lastPt = controlPoints[controlPoints.length - 2];
      pts.push(lastPt);
      if (pts.length > 1) {
        const prev = pts[pts.length - 2];
        totalD += Math.hypot(lastPt.x - prev.x, lastPt.y - prev.y);
        dists.push(totalD);
      }

      return { trackPts: pts, trackDists: dists, totalLength: totalD };
    }

    // ── Построение Единых Эталонных Траекторий (Single Master Tracks) ──────────
    // 0. Внешняя дорожка — 1-й круг (Плавная мастер-дуга без волн от 18.0R до точки X: 1200.0px, Y: 607.3px)
    const masterTrack1 = (() => {
      const x0 = gx(colR(18.0));
      const cp = [
        { x: x0, y: yRow28 - 100 },
        { x: x0, y: yRow28 },
        { x: gx(colR(15.0)), y: gy(rowJ(23.0)) }, // Точка 15:23
        { x: gx(colR(12.2)), y: gy(rowJ(19.0)) }, // Точка 12.2:19
        { x: trackX1, y: entryY1 },               // Точка входа (1200.0, 607.3)
        { x: trackX1 - 20, y: entryY1 + 60 },
      ];
      return createCatmullRomSpline(cp);
    })();

    const baseCirc1Pts = openCircPts(CIRC_CX, CIRC_CY, CIRC_R, 140, 0);
    const circle1Dots = baseCirc1Pts.map((p, i) => {
      const a = Math.atan2(p.y - CIRC_CY, p.x - CIRC_CX);
      let da = a - a_entry1;
      while (da <= 0.0001) da += 2 * Math.PI;
      while (da > 2 * Math.PI) da -= 2 * Math.PI;
      return {
        idx: i,
        pInit: p,
        da,
        color: BLACK_SQ,
      };
    });
    const sortedCirc1 = [...circle1Dots].sort((a, b) => b.da - a.da);
    sortedCirc1.forEach((d, m) => {
      d.trainIdx = m;
      const c = Math.floor(m / 35);
      const k = m % 35;
      d.c = c;
      d.k = k;
      d.pBox = {
        x: gx(colR(colOffsets1[c])),
        y: yRow28 - k * deltaS1,
      };
    });

    const L_train_total1 = masterTrack1.totalLength + 140 * deltaS1;

    // ── Последовательный марш 1-го круга (единой сплошной цепочкой из 140 человек) ──
    function getCircle1EntrancePos(d, u) {
      const m = d.trainIdx; // 0..139
      const c = d.c; // 0..3 (колонка ожидания)
      const k = d.k; // 0..34 (позиция в колонке)

      const s_train = L_train_total1 * (u / (23.5 / 26.0));
      const s_col_start = c * 35 * deltaS1;

      if (s_train < s_col_start) return d.pBox;

      const d_col = s_train - s_col_start;
      const d_in_box = k * deltaS1;

      if (d_col < d_in_box) {
        const y = (yRow28 - d_in_box) + d_col;
        const xBox = gx(colR(colOffsets1[c]));
        const xMaster = gx(colR(18.0));
        // Плавный шаг в створ ведущей колонки 18R перед 28-м рядом:
        const distTo28 = yRow28 - y;
        const stepFrac = Math.min(1.0, Math.max(0, 1.0 - distTo28 / (1.5 * STEP)));
        const smooth = (1 - Math.cos(Math.PI * stepFrac)) / 2;
        const x = xBox + (xMaster - xBox) * smooth;
        return { x, y };
      }

      // Все 140 человек идут строго по единой мастер-дуге
      const s_on_arc = d_col - d_in_box;
      if (s_on_arc <= masterTrack1.totalLength) {
        return getPointAtDist(masterTrack1.trackPts, masterTrack1.trackDists, s_on_arc);
      }

      // Движение по 1-му кругу от точки 1200.0, 607.3 по часовой стрелке снизу
      const d_circ = s_on_arc - masterTrack1.totalLength;
      const d_circ_target = d.da !== undefined ? (d.da * R1) : ((140 - m) * deltaS1);

      if (d_circ >= d_circ_target) return d.pInit;

      const a = a_entry1 + d_circ / R1;
      return {
        x: CIRC_CX + R1 * Math.cos(a),
        y: CIRC_CY + R1 * Math.sin(a),
      };
    }

    // 1. Внешняя дорожка — 2-й круг (Мастер-дуга от колонки 3.0R)
    const masterTrack2 = (() => {
      const x0 = gx(colR(3.0));
      const cp = [
        { x: x0, y: yRow27 - 100 },
        { x: x0, y: yRow27 },
        { x: gx(colR(8.0)), y: gy(rowJ(23.0)) }, // Точка 8:23
        { x: gx(colR(9.0)), y: gy(rowJ(19.0)) }, // Точка 9:19
        { x: trackX, y: entryY },                // Точка входа (1127.9, 606.7)
        { x: trackX - 25, y: entryY + 60 },
      ];
      return createCatmullRomSpline(cp);
    })();

    // 2. Средняя дорожка — 3-й круг (Мастер-дуга от колонки 1.0R, ближе ко 2-му кругу)
    const masterTrack3 = (() => {
      const x0 = gx(colR(1.0));
      const cp = [
        { x: x0, y: yRow27 - 100 },
        { x: x0, y: yRow27 },
        { x: gx(colR(6.2)), y: gy(rowJ(23.0)) }, // Точка 6.2:23
        { x: gx(colR(7.2)), y: gy(rowJ(19.0)) }, // Точка 7.2:19
        { x: trackX3, y: entryY3 },              // Точка входа 4:15 (1048.0, 608.0)
        { x: trackX3 - 25, y: entryY3 + 60 },
      ];
      return createCatmullRomSpline(cp);
    })();

    // 3. Внутренняя дорожка — 4-й круг (Мастер-дуга от колонки 0, плотно прилегает к 3-му кругу)
    const masterTrack4 = (() => {
      const x0 = CIRC_CX;
      const cp = [
        { x: x0, y: yRow27 - 100 },
        { x: x0, y: yRow27 },
        { x: gx(colR(4.5)), y: gy(rowJ(23.0)) }, // Точка 4.5:23 (плотно и близко к 3-му кругу!)
        { x: gx(colR(5.5)), y: gy(rowJ(19.0)) }, // Точка 5.5:19
        { x: trackX4, y: entryY4 },              // Точка входа 1:15 (976.0, 608.0)
        { x: trackX4 - 20, y: entryY4 + 40 },
      ];
      return createCatmullRomSpline(cp);
    })();

    const L_train_total = masterTrack2.totalLength + 100 * deltaS;

    // ── Последовательный марш 2-го круга (со смещением в строй первой колонки) ──
    function getPerformerEntrancePos(d, u) {
      if (d.trainIdx === undefined) return d.pInit;
      const m = d.trainIdx; // 0..99
      const c = Math.floor(m / 25); // 0..3 (колонка ожидания)
      const k = m % 25; // 0..24 (позиция в колонке)

      const s_train = L_train_total * (u / (23.5 / 26.0));
      const s_col_start = c * 25 * deltaS;

      if (s_train < s_col_start) return d.pBox;

      const d_col = s_train - s_col_start;
      const d_in_box = k * deltaS;

      if (d_col < d_in_box) {
        const y = (yRow27 - d_in_box) + d_col;
        const xBox = gx(colR(colOffsets2[c]));
        const xMaster = gx(colR(3.0));
        // Плавный шаг в сторону ведущей линии (3.0R) перед 27 рядом:
        const distTo27 = yRow27 - y;
        const stepFrac = Math.min(1.0, Math.max(0, 1.0 - distTo27 / (1.5 * STEP)));
        const smooth = (1 - Math.cos(Math.PI * stepFrac)) / 2;
        const x = xBox + (xMaster - xBox) * smooth;
        return { x, y };
      }

      // Все 100 человек идут строго по одной мастер-дуге с идеальным шагом deltaS
      const s_on_arc = d_col - d_in_box;
      if (s_on_arc <= masterTrack2.totalLength) {
        return getPointAtDist(masterTrack2.trackPts, masterTrack2.trackDists, s_on_arc);
      }

      // Движение по 2-му кругу
      const d_circ = s_on_arc - masterTrack2.totalLength;
      const d_circ_target = d.da !== undefined ? (d.da * R2) : ((100 - m) * deltaS);

      if (d_circ >= d_circ_target) return d.pInit;

      const a = a_entry + d_circ / R2;
      return {
        x: CIRC_CX + R2 * Math.cos(a),
        y: CIRC_CY + R2 * Math.sin(a),
      };
    }

    // ── Последовательный марш 3-го круга (со смещением в строй первой колонки) ──
    function getPerformerEntrancePosCircle3(d, u) {
      if (d.trainIdx3 === undefined) return d.pInit;
      const m = d.trainIdx3; // 0..49
      const c = Math.floor(m / 25); // 0..1
      const k = m % 25;

      const s_train = L_train_total * (u / (23.5 / 26.0));
      const s_col_start = c * 25 * deltaS3;

      if (s_train < s_col_start) return d.pBox3;

      const d_col = s_train - s_col_start;
      const d_in_box = k * deltaS3;

      if (d_col < d_in_box) {
        const y = (yRow27 - d_in_box) + d_col;
        const xBox = gx(colR(colOffsets3[c]));
        const xMaster = gx(colR(1.0));
        // Плавный шаг в сторону ведущей линии (1.0R) перед 27 рядом:
        const distTo27 = yRow27 - y;
        const stepFrac = Math.min(1.0, Math.max(0, 1.0 - distTo27 / (1.5 * STEP)));
        const smooth = (1 - Math.cos(Math.PI * stepFrac)) / 2;
        const x = xBox + (xMaster - xBox) * smooth;
        return { x, y };
      }

      const s_on_arc = d_col - d_in_box;
      if (s_on_arc <= masterTrack3.totalLength) {
        return getPointAtDist(masterTrack3.trackPts, masterTrack3.trackDists, s_on_arc);
      }

      // Движение по 3-му кругу
      const d_circ = s_on_arc - masterTrack3.totalLength;
      const d_circ_target = d.da !== undefined ? (d.da * R3) : ((50 - m) * deltaS3);

      if (d_circ >= d_circ_target) return d.pInit;

      const a = a_entry3 + d_circ / R3;
      return {
        x: CIRC_CX + R3 * Math.cos(a),
        y: CIRC_CY + R3 * Math.sin(a),
      };
    }

    // ── Последовательный марш 4-го круга ──
    function getPerformerEntrancePosCircle4(d, u) {
      if (d.trainIdx4 === undefined) return d.pInit;
      const m = d.trainIdx4; // 0..9

      const s_train = L_train_total * (u / (23.5 / 26.0));
      const d_in_box = m * deltaS4;

      if (s_train < d_in_box) {
        return { x: d.pBox4.x, y: (yRow27 - d_in_box) + s_train };
      }

      const s_on_arc = s_train - d_in_box;
      if (s_on_arc <= masterTrack4.totalLength) {
        return getPointAtDist(masterTrack4.trackPts, masterTrack4.trackDists, s_on_arc);
      }

      // Движение по 4-му кругу
      const d_circ = s_on_arc - masterTrack4.totalLength;
      const d_circ_target = d.da !== undefined ? (d.da * R4) : ((10 - m) * deltaS4);

      if (d_circ >= d_circ_target) return d.pInit;

      const a = a_entry4 + d_circ / R4;
      return {
        x: CIRC_CX + R4 * Math.cos(a),
        y: CIRC_CY + R4 * Math.sin(a),
      };
    }

    const RED_ROCKS = [
      { pts: [[colL(19), rowJ(30)], [colL(17.5), rowJ(32.5)], [colL(16), rowJ(29)], [colL(18), rowJ(26)]], color: "#7F1D1D" },
      { pts: [[colL(19), rowJ(30)], [colL(17.5), rowJ(32.5)], [colL(16), rowJ(29)]], color: "#B91C1C" },
      { pts: [[colL(17.5), rowJ(32.5)], [colL(15), rowJ(33)], [colL(16), rowJ(29)]], color: "#DC2626" },
      { pts: [[colL(15), rowJ(33)], [colL(13.5), rowJ(30.5)], [colL(16), rowJ(29)]], color: "#EF4444" },
      { pts: [[colL(16), rowJ(29)], [colL(13.5), rowJ(30.5)], [colL(14.5), rowJ(26)]], color: "#B91C1C" },
      { pts: [[colL(18), rowJ(26)], [colL(16), rowJ(29)], [colL(14.5), rowJ(26)]], color: "#991B1B" },
      { pts: [[colL(15), rowJ(33)], [colL(12), rowJ(33.5)], [colL(13.5), rowJ(30.5)]], color: "#DC2626" },
      { pts: [[colL(13.5), rowJ(30.5)], [colL(12), rowJ(33.5)], [colL(10.5), rowJ(31)]], color: "#F87171" },
      { pts: [[colL(13.5), rowJ(30.5)], [colL(10.5), rowJ(31)], [colL(12), rowJ(27)]], color: "#991B1B" },

    // 3-я линия/полукруг: 11:4.2 -> 15:15 (30 dots)
    function createArcPoints(colStart, rowStart, colEnd, rowEnd, n, isRight) {
      const pStart = {
        x: isRight ? gx(colR(colStart)) : gx(colL(colStart)),
        y: gy(rowJ(rowStart)),
      };
      const pEnd = {
        x: isRight ? gx(colR(colEnd)) : gx(colL(colEnd)),
y: gy(rowJ(rowEnd)),
      };

      const dxS = pStart.x - CIRC_CX;
      const dyS = pStart.y - CIRC_CY;
      const dxE = pEnd.x - CIRC_CX;
      const dyE = pEnd.y - CIRC_CY;

      let aS = Math.atan2(dyS, dxS);
      let aE = Math.atan2(dyE, dxE);

      if (!isRight) {
        if (aE < 0) aE += 2 * Math.PI;
      } else {
        if (aS < 0) aS += 2 * Math.PI;
      }

      const rS = Math.hypot(dxS, dyS);
      const rE = Math.hypot(dxE, dyE);

      return Array.from({ length: n }, (_, i) => {
        const u = i / (n - 1);
        const a = aS + (aE - aS) * u;
        const r = rS + (rE - rS) * u;
        return {
          x: CIRC_CX + r * Math.cos(a),
          y: CIRC_CY + r * Math.sin(a),
        };
      });
    }

    // 1-я линия (35 точек): 18:27 -> 27:36, марширует прямо до 12:16, затем полукруг
    // 2-я линия (35 точек): 19:27 -> 28:36, марширует прямо до 14:16, затем полукруг
    // 3-я линия (30 точек): 20:27 -> 28:35, марширует прямо до 16:15, затем полукруг
    function getEntranceLinePoint(lineNum, dotIdx, N, isRight, u) {
      let startCol, startRow, midCol, midRow, arcPts;
      if (lineNum === 1) {

        midCol = 20;   midRow = 27;
        arcPts = isRight ? Arc3_R_30 : Arc3_L_30;
      }

      const B = { x: gx(isRight ? colR(startCol) : colL(startCol)), y: gy(rowJ(startRow)) };
      const A = { x: gx(isRight ? colR(midCol) : colL(midCol)), y: gy(rowJ(midRow)) };
      const E = arcPts[arcPts.length - 1]; // Верхний анкер дуги

      const L_straight = Math.hypot(E.x - B.x, E.y - B.y);
      const L_BA = Math.hypot(A.x - B.x, A.y - B.y);

      const N_pts = arcPts.length;
      let L_arc = 0;
      const distFromTopArr = new Array(N_pts);
      distFromTopArr[N_pts - 1] = 0;
      for (let k = N_pts - 2; k >= 0; k--) {
        const d = Math.hypot(arcPts[k].x - arcPts[k+1].x, arcPts[k].y - arcPts[k+1].y);
        L_arc += d;
        distFromTopArr[k] = L_arc;
      }

      const fracInit = dotIdx / (N - 1);
      const s0 = L_BA * (1 - fracInit);
      const s1 = L_straight + distFromTopArr[dotIdx];

      // Линейный ход u: постоянная строевая скорость без разгона и замедления
      const sProgress = Math.max(0, Math.min(1, u));
      const curS = s0 + (s1 - s0) * sProgress;

      if (curS <= L_straight) {
        const ratio = L_straight === 0 ? 0 : curS / L_straight;
        return {
          x: B.x + (E.x - B.x) * ratio,
          y: B.y + (E.y - B.y) * ratio,
        };
      } else {
        const dArc = curS - L_straight;
        const targetD = Math.max(0, Math.min(L_arc, dArc));
        for (let k = N_pts - 2; k >= 0; k--) {
          if (targetD <= distFromTopArr[k]) {
            const dStart = distFromTopArr[k+1];
            const dEnd = distFromTopArr[k];
            const segLen = dEnd - dStart;
            const frac = segLen === 0 ? 0 : (targetD - dStart) / segLen;
            return {
              x: arcPts[k+1].x + (arcPts[k].x - arcPts[k+1].x) * frac,
              y: arcPts[k+1].y + (arcPts[k].y - arcPts[k+1].y) * frac,
            };
          }
        }
        return arcPts[0];
      }

    function buildHookTrack(isRight, isLine2) {
      const colFn = isRight ? colR : colL;
      const colTarget = isLine2 ? 11.0 : 10.5;

      const hookPeakCol = isLine2 ? 11.2 : 10.3;
      const hookPeakRow = isLine2 ? 19.3 : 18.8;

      const cp = [
        { x: gx(colFn(diagStartCol)), y: gy(rowJ(diagStartRow)) },

        { x: gx(colFn(diagTopCol)), y: gy(rowJ(diagTopRow)) },

        { x: gx(colFn(colTarget)), y: gy(rowJ(12.0)) },

      const pts = [];

      let totalD = 0;
      const numSegs = cp.length - 1;
      const samplesPerSeg = 50;

      for (let s = 0; s < numSegs; s++) {
        const p0 = cp[Math.max(0, s - 1)];
        const p1 = cp[s];
        const p2 = cp[s + 1];
        const p3 = cp[Math.min(cp.length - 1, s + 2)];

        for (let i = 0; i < samplesPerSeg; i++) {
          const t = i / samplesPerSeg;
          const t2 = t * t, t3 = t2 * t;
          const x = 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x - 5*p1.x + 4*p2.x - p3.x)*t2 + (-p0.x + 3*p1.x - 3*p2.x + p3.x)*t3);
          const y = 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y - 5*p1.y + 4*p2.y - p3.y)*t2 + (-p0.y + 3*p1.y - 3*p2.y + p3.y)*t3);
          pts.push({ x, y });
          if (pts.length > 1) {
            totalD += Math.hypot(x - pts[pts.length - 2].x, y - pts[pts.length - 2].y);
            dists.push(totalD);
          }
        }
      }
      return { pts, dists, totalD };
    }

    function findNearestDist(pts, dists, pTarget) {
      let bestDist = 0;
      let minDist = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const d = Math.hypot(pts[i].x - pTarget.x, pts[i].y - pTarget.y);
        if (d < minDist) {
          minDist = d;
          bestDist = dists[i];
        }
      }
      return bestDist;
    }

    const hookTrackL1 = buildHookTrack(false, false);
    const hookTrackL2 = buildHookTrack(false, true);
    const hookTrackR1 = buildHookTrack(true, false);
    const hookTrackR2 = buildHookTrack(true, true);

    function getArch1Point(t) {
      const v = 1 - t;
      const pStart = { c: 10.5, r: 18.0 };
      const pEnd = { c: 14.5, r: 7.5 };
      const cp1 = { c: 12.0, r: 17.5 };
      const cp2 = { c: 13.8, r: 14.0 };
      const c = v*v*v*pStart.c + 3*v*v*t*cp1.c + 3*v*t*t*cp2.c + t*t*t*pEnd.c;
      const r = v*v*v*pStart.r + 3*v*v*t*cp1.r + 3*v*t*t*cp2.r + t*t*t*pEnd.r;
      return { c, r };
    }

    function getArch2Point(t) {
      const v = 1 - t;
      const pStart = { c: 11.2, r: 18.8 };
      const pEnd = { c: 15.2, r: 8.5 };
      const cp1 = { c: 12.8, r: 18.0 };
      const cp2 = { c: 14.5, r: 14.5 };
      const c = v*v*v*pStart.c + 3*v*v*t*cp1.c + 3*v*t*t*cp2.c + t*t*t*pEnd.c;
      const r = v*v*v*pStart.r + 3*v*v*t*cp1.r + 3*v*t*t*cp2.r + t*t*t*pEnd.r;
      return { c, r };
    }

    function getDiag1Point(t) {
      const c = 15.5 + (25.0 - 15.5) * t;
      const r = 15.5 - (15.5 - 3.0) * t;
      return { c, r };
    }

    function getDiag2Point(t) {
      const c = 16.5 + (26.0 - 16.5) * t;
      const r = 15.0 - (15.0 - 3.5) * t;
      return { c, r };
    }

    // Build 100 dot descriptors for left and right side
    const dotsLeft = [];
    const dotsRight = [];

    // 1. Top 15 dots from Line 1 (Transition to Overhead Arch 1)
    for (let i = 0; i < 15; i++) {
      const pt = getArch1Point(i / 14);
      dotsLeft.push({
        lineNum: 1, lineDotIdx: i, lineTotal: 35,
        p0: Arc1_L_35[i],
        p1: L1_pts_35[i],
        p2: L1_pts_50[2 * i],

        color: BLACK_SQ,
        type: 'L1_top',
        idx: i,

      });
      dotsRight.push({
        lineNum: 1, lineDotIdx: i, lineTotal: 35,
        p0: Arc1_R_35[i],
        p1: R1_pts_35[i],
        p2: R1_pts_50[2 * i],
        pHeadphone: { x: gx(colR(pt.c)), y: gy(rowJ(pt.r)), defaultX: gx(colR(pt.c)), defaultY: gy(rowJ(pt.r)) },
        color: BLACK_SQ,
        type: 'L1_top',
        idx: i,
        total: 15,
      });
    }

    // 2. Top 15 dots from Line 2 (Transition to 1st Outer Circle ring)
    for (let i = 0; i < 15; i++) {
      const pCircL = getCircleHalfPt(10 * STEP, i, 25, false);
      const pCircR = getCircleHalfPt(10 * STEP, i, 25, true);
      dotsLeft.push({
        lineNum: 2, lineDotIdx: i, lineTotal: 35,
        p0: Arc2_L_35[i],
        p1: L2_pts_35[i],
        p2: L1_pts_50[2 * i + 1],
        pHeadphone: { x: pCircL.x, y: pCircL.y, defaultX: pCircL.x, defaultY: pCircL.y },
        color: BLACK_SQ,
        type: 'L2_cross',
        idx: i,
        total: 15,
      });
      dotsRight.push({
        lineNum: 2, lineDotIdx: i, lineTotal: 35,
        p0: Arc2_R_35[i],
        p1: R2_pts_35[i],
        p2: R1_pts_50[2 * i + 1],
        pHeadphone: { x: pCircR.x, y: pCircR.y, defaultX: pCircR.x, defaultY: pCircR.y },
        color: BLACK_SQ,
        type: 'L2_cross',
        idx: i,
        total: 15,
      });
    }

    // 3. Bottom 20 dots from Line 1 (10 dots continue Outer Circle ring, 10 dots close Headphone via hook track)
    for (let i = 0; i < 20; i++) {
      const isClosing1 = (i >= 10);
      const closeK = i - 10; // 0..9 (i=19 is leader at top of diagonal going to row 2)
      const closeR = 7.0 - (7.0 - 2.0) * (closeK / 9);

      let hookTrackL1_pts = null, hookTrackL1_dists = null, hookS0_L1 = 0, hookS1_L1 = 0;
      let hookTrackR1_pts = null, hookTrackR1_dists = null, hookS0_R1 = 0, hookS1_R1 = 0;
      let pHeadphoneL1, pHeadphoneR1;

      if (isClosing1) {
        hookTrackL1_pts = hookTrackL1.pts;
        hookTrackL1_dists = hookTrackL1.dists;
        hookS0_L1 = findNearestDist(hookTrackL1.pts, hookTrackL1.dists, L1_pts_50[30 + i]);
        const s_top_L1 = findNearestDist(hookTrackL1.pts, hookTrackL1.dists, { x: gx(colL(10.5)), y: gy(rowJ(7.0)) });
        const s_bot_L1 = hookTrackL1.totalD;
        hookS1_L1 = s_top_L1 + (s_bot_L1 - s_top_L1) * (closeK / 9);

        hookTrackR1_pts = hookTrackR1.pts;
        hookTrackR1_dists = hookTrackR1.dists;
        hookS0_R1 = findNearestDist(hookTrackR1.pts, hookTrackR1.dists, R1_pts_50[30 + i]);
        const s_top_R1 = findNearestDist(hookTrackR1.pts, hookTrackR1.dists, { x: gx(colR(10.5)), y: gy(rowJ(7.0)) });
        const s_bot_R1 = hookTrackR1.totalD;
        hookS1_R1 = s_top_R1 + (s_bot_R1 - s_top_R1) * (closeK / 9);

        pHeadphoneL1 = { x: gx(colL(10.5)), y: gy(rowJ(closeR)), defaultX: gx(colL(10.5)), defaultY: gy(rowJ(closeR)) };
        pHeadphoneR1 = { x: gx(colR(10.5)), y: gy(rowJ(closeR)), defaultX: gx(colR(10.5)), defaultY: gy(rowJ(closeR)) };
      } else {
        const pCircL = getCircleHalfPt(10 * STEP, 15 + i, 25, false);
        const pCircR = getCircleHalfPt(10 * STEP, 15 + i, 25, true);
        pHeadphoneL1 = { x: pCircL.x, y: pCircL.y, defaultX: pCircL.x, defaultY: pCircL.y };
        pHeadphoneR1 = { x: pCircR.x, y: pCircR.y, defaultX: pCircR.x, defaultY: pCircR.y };

      dotsLeft.push({

    // 4. 30 purple dots from Line 3 (15 dots to Overhead Arch 2, 15 dots to Concentric Circle ring)
    for (let i = 0; i < 30; i++) {
      let pHeadphoneL, pHeadphoneR;
      if (i < 15) {
        const pt = getArch2Point(i / 14);
        pHeadphoneL = { x: gx(colL(pt.c)), y: gy(rowJ(pt.r)), defaultX: gx(colL(pt.c)), defaultY: gy(rowJ(pt.r)) };
        pHeadphoneR = { x: gx(colR(pt.c)), y: gy(rowJ(pt.r)), defaultX: gx(colR(pt.c)), defaultY: gy(rowJ(pt.r)) };
      } else {
        const pCircL = getCircleHalfPt(10.6 * STEP, i - 15, 25, false);
        const pCircR = getCircleHalfPt(10.6 * STEP, i - 15, 25, true);
        pHeadphoneL = { x: pCircL.x, y: pCircL.y, defaultX: pCircL.x, defaultY: pCircL.y };
        pHeadphoneR = { x: pCircR.x, y: pCircR.y, defaultX: pCircR.x, defaultY: pCircR.y };
      }

      dotsLeft.push({
        lineNum: 3, lineDotIdx: i, lineTotal: 30,
        p0: Arc3_L_30[i],
        p1: L3_pts_30[i],
        p2: L2_pts_50[i],

        type: 'L3_march',
        idx: i,
        total: 30,

      dotsRight.push({
        lineNum: 3, lineDotIdx: i, lineTotal: 30,
        p0: Arc3_R_30[i],
        p1: R3_pts_30[i],
        p2: R2_pts_50[i],
        pHeadphone: pHeadphoneR,
        color: PURPLE,
        type: 'L3_march',
        idx: i,
        total: 30,

    // 5. Bottom 20 black dots from Line 2 (10 dots continue Concentric Circle ring, 10 dots close Headphone via hook track)
    for (let i = 0; i < 20; i++) {
      const isClosing2 = (i >= 10);
      const closeK = i - 10; // 0..9
      const closeR = 7.0 - (7.0 - 2.0) * (closeK / 9);

      let hookTrackL2_pts = null, hookTrackL2_dists = null, hookS0_L2 = 0, hookS1_L2 = 0;
      let hookTrackR2_pts = null, hookTrackR2_dists = null, hookS0_R2 = 0, hookS1_R2 = 0;
      let pHeadphoneL2, pHeadphoneR2;

      if (isClosing2) {
        hookTrackL2_pts = hookTrackL2.pts;
        hookTrackL2_dists = hookTrackL2.dists;
        hookS0_L2 = findNearestDist(hookTrackL2.pts, hookTrackL2.dists, L2_pts_50[30 + i]);
        const s_top_L2 = findNearestDist(hookTrackL2.pts, hookTrackL2.dists, { x: gx(colL(11.0)), y: gy(rowJ(7.0)) });
        const s_bot_L2 = hookTrackL2.totalD;
        hookS1_L2 = s_top_L2 + (s_bot_L2 - s_top_L2) * (closeK / 9);

        hookTrackR2_pts = hookTrackR2.pts;
        hookTrackR2_dists = hookTrackR2.dists;
        hookS0_R2 = findNearestDist(hookTrackR2.pts, hookTrackR2.dists, R2_pts_50[30 + i]);
        const s_top_R2 = findNearestDist(hookTrackR2.pts, hookTrackR2.dists, { x: gx(colR(11.0)), y: gy(rowJ(7.0)) });
        const s_bot_R2 = hookTrackR2.totalD;
        hookS1_R2 = s_top_R2 + (s_bot_R2 - s_top_R2) * (closeK / 9);

        pHeadphoneL2 = { x: gx(colL(11.0)), y: gy(rowJ(closeR)), defaultX: gx(colL(11.0)), defaultY: gy(rowJ(closeR)) };
        pHeadphoneR2 = { x: gx(colR(11.0)), y: gy(rowJ(closeR)), defaultX: gx(colR(11.0)), defaultY: gy(rowJ(closeR)) };
      } else {
        const pCircL = getCircleHalfPt(10.6 * STEP, 15 + i, 25, false);
        const pCircR = getCircleHalfPt(10.6 * STEP, 15 + i, 25, true);
        pHeadphoneL2 = { x: pCircL.x, y: pCircL.y, defaultX: pCircL.x, defaultY: pCircL.y };
        pHeadphoneR2 = { x: pCircR.x, y: pCircR.y, defaultX: pCircR.x, defaultY: pCircR.y };
      }

      dotsLeft.push({
        lineNum: 2, lineDotIdx: 15 + i, lineTotal: 35,
        p0: Arc2_L_35[15 + i],
        p1: L2_pts_35[15 + i],
        p2: L2_pts_50[30 + i],
        pHeadphone: pHeadphoneL2,

        hookS1: hookS1_L2,
        color: BLACK_SQ,
        type: 'L2_bot',
        idx: i,
        total: 20,
      });
      dotsRight.push({
        lineNum: 2, lineDotIdx: 15 + i, lineTotal: 35,
        p0: Arc2_R_35[15 + i],
        p1: R2_pts_35[15 + i],
        p2: R2_pts_50[30 + i],
        pHeadphone: pHeadphoneR2,
        hookTrackPts: hookTrackR2_pts,
        hookTrackDists: hookTrackR2_dists,
        hookS0: hookS0_R2,
        hookS1: hookS1_R2,
        color: BLACK_SQ,
        type: 'L2_bot',
        idx: i,
        total: 20,
      });
    }

    // ── Build Base SVG Markup ───────────────────────────────────────────────────
    let svgHtml = `<svg viewBox="0 0 ${SVG_W} ${SVG_H}" preserveAspectRatio="xMidYMid meet">
      <rect width="${SVG_W}" height="${SVG_H}" fill="#000000" />
      <rect x="${FX}" y="${FY}" width="${FIELD_W}" height="${FIELD_H}" fill="#f3f0f7" stroke="black" stroke-width="1" />

      <g id="stage-backdrop">
        ${RED_ROCKS.map(f => `<polygon points="${f.pts.map(([c, r]) => `${gx(c)},${gy(r)}`).join(" ")}" fill="${f.color}" stroke="#450A0A" stroke-width="0.7" />`).join("")}
        ${CENTER_ROCKS.map(f => `<polygon points="${f.pts.map(([c, r]) => `${gx(c)},${gy(r)}`).join(" ")}" fill="${f.color}" stroke="${f.stroke}" stroke-width="0.8" />`).join("")}
        ${ORANGE_ROCKS.map(f => `<polygon points="${f.pts.map(([c, r]) => `${gx(c)},${gy(r)}`).join(" ")}" fill="${f.color}" stroke="#7C2D12" stroke-width="0.7" />`).join("")}

        <rect x="${gx(colL(6.5))}" y="${gy(rowJ(37))}" width="${13 * STEP}" height="${0.7 * STEP}" fill="#8D5B4C" stroke="#5C3326" stroke-width="1.5" />
        <rect x="${gx(colL(6.5))}" y="${gy(rowJ(37))}" width="${1.2 * STEP}" height="${3.5 * STEP}" fill="#8D5B4C" stroke="#5C3326" stroke-width="1.5" />
        <rect x="${gx(colR(5.3))}" y="${gy(rowJ(37))}" width="${1.2 * STEP}" height="${3.5 * STEP}" fill="#8D5B4C" stroke="#5C3326" stroke-width="1.5" />
        <polygon points="${gx(colL(4.5))},${gy(rowJ(37))} ${gx(colL(3.5))},${gy(rowJ(38.2))} ${gx(colR(3.5))},${gy(rowJ(38.2))} ${gx(colR(4.5))},${gy(rowJ(37))}" fill="#744436" stroke="#5C3326" stroke-width="1.5" />

        <polygon points="${gx(colL(6.5))},${gy(rowJ(33))} ${gx(colL(6.5))},${gy(rowJ(36))} ${gx(colL(17))},${gy(rowJ(37.5))} ${gx(colL(17))},${gy(rowJ(34.5))}" fill="#1E3A8A" stroke="#172554" stroke-width="1.5" />
        <polygon points="${gx(colL(17))},${gy(rowJ(34.5))} ${gx(colL(17))},${gy(rowJ(37.5))} ${gx(colL(17.6))},${gy(rowJ(38.5))} ${gx(colL(17.6))},${gy(rowJ(35.5))}" fill="#172554" stroke="#0F172A" stroke-width="1" />
        ${[34.8, 35.5, 36.2, 36.9].map(lvl => `<line x1="${gx(colL(6.5))}" y1="${gy(rowJ(lvl - 1.2))}" x2="${gx(colL(17))}" y2="${gy(rowJ(lvl))}" stroke="#3B82F6" stroke-width="0.8" opacity="0.6" />`).join("")}

        <polygon points="${gx(colR(6.5))},${gy(rowJ(33))} ${gx(colR(6.5))},${gy(rowJ(36))} ${gx(colR(17))},${gy(rowJ(37.5))} ${gx(colR(17))},${gy(rowJ(34.5))}" fill="#1E3A8A" stroke="#172554" stroke-width="1.5" />
        <polygon points="${gx(colR(17))},${gy(rowJ(34.5))} ${gx(colR(17))},${gy(rowJ(37.5))} ${gx(colR(17.6))},${gy(rowJ(38.5))} ${gx(colR(17.6))},${gy(rowJ(35.5))}" fill="#172554" stroke="#0F172A" stroke-width="1" />
        ${[34.8, 35.5, 36.2, 36.9].map(lvl => `<line x1="${gx(colR(6.5))}" y1="${gy(rowJ(lvl - 1.2))}" x2="${gx(colR(17))}" y2="${gy(rowJ(lvl))}" stroke="#3B82F6" stroke-width="0.8" opacity="0.6" />`).join("")}

        <rect x="${gx(colL(6.5))}" y="${gy(rowJ(35.5))}" width="${13 * STEP}" height="${2.5 * STEP}" fill="#9333EA" stroke="#581C87" stroke-width="2" />
        ${[35.0, 34.5, 34.0, 33.5].map(lvl => `<line x1="${gx(colL(6.5))}" y1="${gy(rowJ(lvl))}" x2="${gx(colR(6.5))}" y2="${gy(rowJ(lvl))}" stroke="#A855F7" stroke-width="1" opacity="0.5" />`).join("")}
      </g>

      <circle cx="${CIRC_CX}" cy="${CIRC_CY}" r="${4 * STEP}" fill="#DDD8C0" stroke="black" stroke-width="1.5" />
      <circle cx="${CIRC_CX}" cy="${CIRC_CY}" r="${0.5 * STEP}" fill="white" stroke="black" stroke-width="1" />`;

    for (let j = 0; j <= ROWS; j++) {
      for (let i = 0; i <= COLS; i++) {
        svgHtml += `<circle cx="${FX + i * STEP}" cy="${FY + j * STEP}" r="${DOT_R}" fill="${DOT_COLOR}" />`;
      }
    }
    svgHtml += `<polygon points="${polyStr(RT, RR, RB, RL)}" fill="none" stroke="#aaa" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.2" />`;
    svgHtml += `<polygon points="${polyStr(LT, LR, LB, LL)}" fill="none" stroke="#aaa" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.2" />`;
    svgHtml += `<g id="diamond-layer"></g><g id="circle-layer"></g><g id="diag-layer"></g><g id="selection-layer"></g>`;
    const textStyle = `font-size="${FONT_SIZE}" fill="${TEXT_COLOR}" font-family="${FONT}" dominant-baseline="middle" text-anchor="middle"`;
    for (let i = 0; i <= COLS; i++) {
      svgHtml += `<text x="${FX + i * STEP}" y="${BY + LABEL_PAD / 2}" ${textStyle}>${Math.abs(i - COLS / 2)}</text>`;
      svgHtml += `<text x="${FX + i * STEP}" y="${FY + FIELD_H + LABEL_PAD / 2}" ${textStyle}>${Math.abs(i - COLS / 2)}</text>`;
    }
    for (let j = 0; j < ROWS; j++) {
      svgHtml += `<text x="${BX + LABEL_PAD / 2}" y="${FY + j * STEP}" ${textStyle}>${ROWS - j}</text>`;
      svgHtml += `<text x="${FX + FIELD_W + LABEL_PAD / 2}" y="${FY + j * STEP}" ${textStyle}>${ROWS - j}</text>`;
    }
    svgHtml += `</svg>`;
    document.getElementById('svg-container').innerHTML = svgHtml;

    // ── Coordinate Converter & Name Helpers ─────────────────────────────────────
    function getColorName(hex) {
      if (!hex) return "Черный";
      const h = hex.toLowerCase();
      if (h === '#dc2626' || h === '#ef4444' || h === '#b91c1c' || h === '#991b1b' || h === '#7f1d1d') return 'Красный';
      if (h === '#ea580c' || h === '#f97316' || h === '#fb923c' || h === '#d97706') return 'Оранжевый';
      if (h === '#16a34a' || h === '#22c55e' || h === '#15803d') return 'Зеленый';
      if (h === '#f472b6' || h === '#e2e8f0') return 'Розово-серый';
      if (h === '#eab308' || h === '#f59e0b') return 'Желтый / Оранжевый';
      if (h === '#9333ea' || h === '#a855f7' || h === '#c084fc') return 'Фиолетовый';
      if (h === '#3b82f6' || h === '#60a5fa' || h === '#1d4ed8') return 'Синий';
      return 'Черный';
    }

    function getFieldGridCoords(x, y) {
      const colFloat = (x - FX) / STEP - (COLS / 2);
      let colStr = "";
      if (Math.abs(colFloat) < 0.05) {
        colStr = "0 (Центр)";
      } else if (colFloat > 0) {
        colStr = colFloat.toFixed(1).replace(/\.0$/, '') + "R (справа)";
      } else {
        colStr = Math.abs(colFloat).toFixed(1).replace(/\.0$/, '') + "L (слева)";
      }

      const rowFloat = (FY + ROWS * STEP - y) / STEP;
      const rowStr = rowFloat.toFixed(1).replace(/\.0$/, '');

      return {
        colStr,
        rowStr,
        svgX: x.toFixed(1),
        svgY: y.toFixed(1),
      };
    }

    // ── Dot Selection State ─────────────────────────────────────────────────────
    let selectedDotInfo = null;

    function selectDot(group, idx) {
      selectedDotInfo = { group, idx };
      updateSelectionRing();
    }

    function getCircleTransitionPt(pA, pB, u) {
      const s = easeInOutCubic(u);
      const dx0 = pA.x - CIRC_CX;
      const dy0 = pA.y - CIRC_CY;
      const dx1 = pB.x - CIRC_CX;
      const dy1 = pB.y - CIRC_CY;
      const r0 = Math.hypot(dx0, dy0);
      const r1 = Math.hypot(dx1, dy1);
      let a0 = Math.atan2(dy0, dx0);
      let a1 = Math.atan2(dy1, dx1);
      let da = a1 - a0;
      while (da > Math.PI) da -= 2 * Math.PI;
      while (da < -Math.PI) da += 2 * Math.PI;
      const r = r0 + (r1 - r0) * s;
      const a = a0 + da * s;
      return {
        x: CIRC_CX + r * Math.cos(a),
        y: CIRC_CY + r * Math.sin(a),
      };
    }

    function renderDiamonds(t) {
      const tSec = t * 106.0;
      let html = '';
      currentPositions.diamond = [];

      diamondDots.forEach((d, i) => {
        let x, y;
        if (tSec <= 26.0) {
          // 0..26s (26s): Синхронный марш по кругам
          const u = tSec / 26.0;
          if (d.circleNum === 2) {
            const p = getPerformerEntrancePos(d, u);
            x = p.x;
            y = p.y;
          } else if (d.circleNum === 3) {
